<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VINIUS MOVIES</title>
<style>
:root{--bg:#07080e;--panel:#111321;--line:#232643;--text:#fff;--muted:#9aa0b8;--green:#00f5a0;--red:#ff3b5c}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:1px solid #ffffff10}
.brand{font-weight:950;font-size:18px}.brand b{color:var(--green)}
.search{margin-left:auto;flex:1;max-width:280px;position:relative}.search input{width:100%;background:#14162a;border:1px solid var(--line);border-radius:20px;padding:9px 12px 9px 34px;color:white;outline:none;font-size:12px}
.s-icon{position:absolute;left:10px;top:9px;color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:12px 3vw}
.card{background:#111321;border:1px solid #ffffff12;border-radius:10px;overflow:hidden;cursor:pointer}
.poster{height:190px;position:relative;background:#0f1222}.poster img{width:100%;height:100%;object-fit:cover}
.quality{position:absolute;top:6px;left:6px;background:var(--green);color:#00140e;border-radius:4px;padding:2px 5px;font-size:7px;font-weight:900}
.dur{position:absolute;bottom:6px;right:6px;background:#000d;color:#fff;border-radius:4px;padding:2px 5px;font-size:8px;font-weight:800}
.info{padding:8px}.title{font-size:10px;font-weight:700;height:28px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.play{width:100%;border:0;border-radius:6px;padding:7px;background:var(--green);color:#00140e;font-size:9px;font-weight:900;margin-top:4px}

/* PLAYER - NO DESCRIPTION - CUSTOM CONTROLS LIKE MX PLAYER */
#player{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
#player.open{display:flex}
.p-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#0a0a0a;border-bottom:1px solid #ffffff10}
.p-head strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75%}
.close{border:0;border-radius:50%;width:30px;height:30px;background:var(--red);color:white;font-size:16px;cursor:pointer}
.v-wrap{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.v-wrap video{width:100%;height:100%;max-height:100%;object-fit:contain;transition:filter 0.2s}

/* Custom Controls Overlay */
.controls{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px;background:linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.6) 100%);opacity:1;transition:opacity 0.3s}
.controls.hide{opacity:0;pointer-events:none}
.center-controls{display:flex;align-items:center;justify-content:center;gap:18px;flex:1}
.ctrl-btn{width:52px;height:52px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff25;color:white;font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);user-select:none}
.ctrl-btn.big{width:64px;height:64px;background:var(--green);color:#00140e;border-color:var(--green);font-size:28px}
.ctrl-btn:active{transform:scale(0.92)}
.bottom-controls{padding:10px 4px 4px}
.progress-wrap{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.progress{flex:1;height:4px;background:#ffffff30;border-radius:4px;position:relative;cursor:pointer}
.progress-filled{height:100%;background:var(--green);border-radius:4px;width:0%}
.time{font-size:10px;color:#ffffffcc;min-width:70px;text-align:right}
.bottom-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.left-tools,.right-tools{display:flex;align-items:center;gap:8px}
.tool{width:36px;height:36px;border-radius:50%;background:#ffffff15;border:1px solid #ffffff20;color:white;display:grid;place-items:center;font-size:14px;cursor:pointer}
.tool.active{background:var(--green);color:#00140e;border-color:var(--green)}
.sliders{display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap}
.slider-group{display:flex;align-items:center;gap:6px;background:#ffffff12;border:1px solid #ffffff15;padding:6px 10px;border-radius:20px}
.slider-group label{font-size:10px;color:#fff;min-width:50px}
.slider-group input[type=range]{width:80px;accent-color:var(--green);height:4px}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.poster{height:170px}.center-controls{gap:12px}.ctrl-btn{width:44px;height:44px;font-size:18px}.ctrl-btn.big{width:56px;height:56px;font-size:24px}.slider-group input[type=range]{width:60px}}
</style>
</head>
<body>
<header class="topbar">
<div class="brand">VINIUS <b>MOVIES</b></div>
<div class="search"><span class="s-icon">⌕</span><input id="search" type="search" placeholder="Search movies"></div>
</header>

<div class="grid" id="grid"></div>
<div style="text-align:center;padding:16px"><button onclick="loadMore()" style="background:#151827;border:1px solid #232643;color:white;padding:10px 20px;border-radius:20px;font-weight:800;font-size:11px;cursor:pointer">LOAD MORE</button></div>

<div id="player">
<div class="p-head"><strong id="pTitle"></strong><button class="close" onclick="closePlayer()">×</button></div>
<div class="v-wrap" id="vWrap">
<video id="video" playsinline preload="auto" crossorigin="anonymous"></video>

<!-- CUSTOM CONTROLS - FORWARD/BACKWARD + BRIGHT + VOLUME -->
<div class="controls" id="controls">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font-size:10px;background:#0008;padding:4px 8px;border-radius:12px;border:1px solid #ffffff20" id="pTime">00:00 / 00:00</span>
<span style="font-size:10px;background:#0008;padding:4px 8px;border-radius:12px;border:1px solid #ffffff20" id="pQuality">HD - Direct</span>
</div>

<div class="center-controls">
<div class="ctrl-btn" onclick="seek(-10)" title="-10s">⏪<span style="font-size:8px;display:block;margin-top:-4px">10</span></div>
<div class="ctrl-btn big" id="playBtn" onclick="togglePlay()">▶</div>
<div class="ctrl-btn" onclick="seek(10)" title="+10s">⏩<span style="font-size:8px;display:block;margin-top:-4px">10</span></div>
</div>

<div class="bottom-controls">
<div class="progress-wrap">
<div class="progress" id="progress" onclick="seekProgress(event)"><div class="progress-filled" id="progressFilled"></div></div>
<div class="time" id="timeDisplay">0:00 / 0:00</div>
</div>

<div class="bottom-row">
<div class="left-tools">
<div class="tool" onclick="toggleMute()" id="volTool" title="Volume">🔊</div>
<div class="tool" onclick="toggleFullscreen()" title="Fullscreen">⛶</div>
<div class="tool" onclick="changeSpeed()" id="speedTool" title="Speed">1x</div>
</div>
<div class="right-tools">
<div class="tool" onclick="document.getElementById('brightSlider').parentElement.classList.toggle('active')" title="Brightness">☀️</div>
</div>
</div>

<div class="sliders">
<div class="slider-group">
<label>🔊 Volume</label>
<input type="range" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
<span id="volVal" style="font-size:10px">100%</span>
</div>
<div class="slider-group">
<label>☀️ Bright</label>
<input type="range" id="brightSlider" min="0.3" max="2" step="0.1" value="1" oninput="setBrightness(this.value)">
<span id="brightVal" style="font-size:10px">100%</span>
</div>
<div class="slider-group">
<label>⏩ Speed</label>
<input type="range" id="speedSlider" min="0.5" max="2" step="0.25" value="1" oninput="setSpeed(this.value)">
<span id="speedVal" style="font-size:10px">1x</span>
</div>
</div>

</div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let activeCat='all',search='';

const BASE=[
{id:"night_of_the_living_dead",title:"Night of the Living Dead - Full Movie 96min",year:"1968",dur:"96 min",poster:"https://archive.org/services/img/night_of_the_living_dead",url:"https://archive.org/download/night_of_the_living_dead/night_of_the_living_dead_512kb.mp4"},
{id:"popeye_ali",title:"Popeye Meets Ali Baba - Big Cartoon 16min",year:"1937",dur:"16 min",poster:"https://archive.org/services/img/Popeye_the_Sailor_Meets_Ali_Babas_Forty_Thieves",url:"https://archive.org/download/Popeye_the_Sailor_Meets_Ali_Babas_Forty_Thieves/Popeye_the_Sailor_Meets_Ali_Babas_Forty_Thieves_512kb.mp4"},
{id:"betty",title:"Betty Boop Snow White - 7min",year:"1933",dur:"7 min",poster:"https://archive.org/services/img/Betty_Boop_Snow_White",url:"https://archive.org/download/Betty_Boop_Snow_White/Betty_Boop_Snow_White_512kb.mp4"},
{id:"gulliver",title:"Gulliver's Travels - Full Cartoon 76min BIG",year:"1939",dur:"76 min",poster:"https://archive.org/services/img/GulliversTravels",url:"https://archive.org/download/GulliversTravels/Gullivers_Travels_1939_512kb.mp4"},
{id:"charlie",title:"Charlie Chaplin The Kid - Full 68min",year:"1921",dur:"68 min",poster:"https://archive.org/services/img/TheKid",url:"https://archive.org/download/TheKid/TheKid_512kb.mp4"},
{id:"superman",title:"Superman 1941 - 10min",year:"1941",dur:"10 min",poster:"https://archive.org/services/img/Superman_1941",url:"https://archive.org/download/Superman_1941/Superman_1941_512kb.mp4"}
];

let allMovies=[];
for(let i=0;i<200;i++){BASE.forEach((b,j)=>{allMovies.push({...b,id:b.id+"_"+i+"_"+j,title:b.title+(i>0?" "+(i+1):""),poster:b.poster,url:b.url})})}
let movies=allMovies.slice(0,100);

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function visible(){return movies.filter(m=>!search||m.title.toLowerCase().includes(search))}
function card(m){return `<div class="card" onclick="playMovie('${m.id}')"><div class="poster"><img loading="lazy" src="${m.poster}" onerror="this.style.display='none'"><span class="quality">HD</span><span class="dur">${m.dur}</span></div><div class="info"><div class="title">${esc(m.title)}</div><button class="play">▶ WATCH</button></div></div>`}
function render(){$('grid').innerHTML=visible().map(card).join('')}

function playMovie(id){
 const m=movies.find(x=>x.id===id)||allMovies.find(x=>x.id===id);if(!m)return;
 $('pTitle').textContent=m.title;
 const v=$('video');
 $('player').classList.add('open');
 // DIRECT LINK - No fetch - Plays like before - Not just link to archive, embedded player
 v.src=m.url;
 v.load();
 // Auto play with custom controls
 v.play().then(()=>{$('playBtn').textContent='⏸';}).catch(()=>{$('playBtn').textContent='▶';});
 // Show controls then auto hide
 showControls();
}

function closePlayer(){const v=$('video');v.pause();v.removeAttribute('src');v.load();$('player').classList.remove('open');}
function togglePlay(){const v=$('video');if(v.paused){v.play();$('playBtn').textContent='⏸';}else{v.pause();$('playBtn').textContent='▶';}}
function seek(sec){const v=$('video');v.currentTime=Math.max(0,Math.min(v.duration||Infinity, v.currentTime+sec));showControls();}
function seekProgress(e){const p=$('progress');const rect=p.getBoundingClientRect();const pct=(e.clientX-rect.left)/rect.width;const v=$('video');if(v.duration){v.currentTime=pct*v.duration;}}
function setVolume(val){const v=$('video');v.volume=val;$('volVal').textContent=Math.round(val*100)+'%';$('volTool').textContent=val==0?'🔇':val<0.5?'🔉':'🔊';}
function toggleMute(){const v=$('video');if(v.volume>0){v.dataset.prevVol=v.volume;setVolume(0);$('volSlider').value=0;}else{const prev=v.dataset.prevVol||1;setVolume(prev);$('volSlider').value=prev;}}
function setBrightness(val){const v=$('video');v.style.filter=`brightness(${val})`;$('brightVal').textContent=Math.round(val*100)+'%';}
function setSpeed(val){const v=$('video');v.playbackRate=parseFloat(val);$('speedVal').textContent=val+'x';$('speedTool').textContent=val+'x';}
function changeSpeed(){const speeds=[0.5,0.75,1,1.25,1.5,1.75,2];const v=$('video');let idx=speeds.indexOf(v.playbackRate);idx=(idx+1)%speeds.length;setSpeed(speeds[idx]);$('speedSlider').value=speeds[idx];}
function toggleFullscreen(){const w=$('vWrap');if(!document.fullscreenElement){w.requestFullscreen().catch(()=>{});}else{document.exitFullscreen();}}

let hideTimer;
function showControls(){const c=$('controls');c.classList.remove('hide');clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(!$('video').paused)c.classList.add('hide');},3500);}
function updateProgress(){
 const v=$('video');if(!v.duration)return;
 const pct=(v.currentTime/v.duration)*100;
 $('progressFilled').style.width=pct+'%';
 const fmt=s=>{const m=Math.floor(s/60);const sec=Math.floor(s%60).toString().padStart(2,'0');return m+':'+sec;};
 $('timeDisplay').textContent=fmt(v.currentTime)+' / '+fmt(v.duration);
 $('pTime').textContent=fmt(v.currentTime)+' / '+fmt(v.duration);
}

window.playMovie=playMovie;window.closePlayer=closePlayer;window.togglePlay=togglePlay;window.seek=seek;window.seekProgress=seekProgress;window.setVolume=setVolume;window.toggleMute=toggleMute;window.setBrightness=setBrightness;window.setSpeed=setSpeed;window.changeSpeed=changeSpeed;window.toggleFullscreen=toggleFullscreen;

$('search').addEventListener('input',e=>{search=e.target.value.toLowerCase();render();});
function loadMore(){movies=movies.concat(allMovies.slice(movies.length,movies.length+80));render();}
window.loadMore=loadMore;

const v=$('video');
v.addEventListener('timeupdate',updateProgress);
v.addEventListener('click',()=>{const c=$('controls');if(c.classList.contains('hide'))showControls();else togglePlay();});
$('vWrap').addEventListener('mousemove',showControls);
$('vWrap').addEventListener('touchstart',showControls);

render();
</script>
</body>
</html>
