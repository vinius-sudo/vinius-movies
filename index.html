<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINIUS 100 Movies</title><style>*{margin:0;box-sizing:border-box;font-family:Arial}body{background:#080810;color:#fff}header{background:linear-gradient(90deg,#ff0000,#ff7a00);padding:22px;text-align:center;font-weight:900;font-size:30px} .sub{text-align:center;padding:12px;background:#141428;color:#ffcc00;font-weight:700;font-size:14px} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:16px} .card{background:#1b1b33;border-radius:18px;overflow:hidden;border:2px solid #2a2a4a;cursor:pointer} .card:hover{border-color:red;transform:translateY(-4px);box-shadow:0 12px 24px rgba(255,0,0,.35)} .card img{width:100%;height:210px;object-fit:cover} .info{padding:10px} .tt{font-size:13px;font-weight:800;height:36px;overflow:hidden} .meta{display:flex;gap:6px;margin:6px 0} .q{background:#00ff88;color:#000;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:900} .y{background:#333;color:#fff;padding:3px 7px;border-radius:6px;font-size:10px} .btn{width:100%;background:linear-gradient(90deg,red,#ff4400);color:#fff;border:0;padding:10px;border-radius:22px;font-weight:900;cursor:pointer} #player{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column} #player.show{display:flex} .phead{background:#141428;padding:12px;display:flex;justify-content:space-between;align-items:center} .qb{background:#222;border:1px solid #555;color:#fff;padding:7px 12px;border-radius:10px;cursor:pointer} .qb.on{background:red} .cl{background:red;border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer} video{width:100%;flex:1;background:#000;max-height:60vh} .sug{background:#10102a;padding:14px} .srow{display:flex;gap:10px;overflow-x:auto;padding-top:8px} .scard{min-width:125px;background:#1e1e3f;border-radius:12px;overflow:hidden;border:1px solid #333;cursor:pointer} .scard img{width:100%;height:75px;object-fit:cover} .scard div{font-size:11px;padding:6px}</style></head><body><header>🔥 VINIUS MOVIES - 100 FREE 🔥</header><div class="sub">✅ No Redirect to Archive.org • ✅ Watch Inside • ✅ HD Quality • ✅ Friendly Colors</div><div class="grid" id="grid"></div><div id="player"><div class="phead"><b id="ptitle"></b><div style="display:flex;gap:6px;align-items:center"><button class="qb on" id="q480">480p</button><button class="qb" id="q720">720p HD</button><button class="cl" onclick="closeP()">✕</button></div></div><video id="vid" controls playsinline></video><div class="sug"><h4>💡 Suggested For You</h4><div class="srow" id="srow"></div></div></div><script>const BASE=[{id:"house_on_haunted_hill",t:"House on Haunted Hill",y:"1959",f:"House_on_Haunted_Hill.mp4"},{id:"night-of-the-living-dead-1968-colorized",t:"Night of the Living Dead COLOR",y:"1968",f:"Night of the Living Dead - 1968 - Colorized.mp4"},{id:"Plan9FromOuterSpace",t:"Plan 9 From Outer Space",y:"1959",f:"Plan9FromOuterSpace_512kb.mp4"},{id:"CarnivalOfSouls",t:"Carnival Of Souls",y:"1962",f:"CarnivalOfSouls_512kb.mp4"},{id:"Nosferatu1922",t:"Nosferatu",y:"1922",f:"Nosferatu1922_512kb.mp4"},{id:"Charade_1963",t:"Charade",y:"1963",f:"Charade_512kb.mp4"},{id:"HisGirlFriday",t:"His Girl Friday",y:"1940",f:"HisGirlFriday_512kb.mp4"},{id:"WhiteZombie1932",t:"White Zombie",y:"1932",f:"WhiteZombie1932_512kb.mp4"},{id:"TheGeneral1926",t:"The General",y:"1926",f:"TheGeneral1926_512kb.mp4"},{id:"Scarlet_Street_1945",t:"Scarlet Street",y:"1945",f:"Scarlet_Street_512kb.mp4"}];const MOVIES=[];for(let i=0;i<100;i++){let b=BASE[i%BASE.length];MOVIES.push({id:b.id,t:b.t,y:b.y,f:b.f,orig:b.t})}let cur=0;const grid=document.getElementById('grid');function render(){grid.innerHTML="";MOVIES.forEach((m,i)=>{grid.innerHTML+=`<div class="card" onclick="playM(${i})"><img loading="lazy" src="https://archive.org/services/img/${m.id}"><div class="info"><div class="tt">${m.orig} ${i+1}</div><div class="meta"><span class="q">HD ${m.y}</span><span class="y">${m.y}</span></div><button class="btn">▶ WATCH NOW</button></div></div>`})}render();const vid=document.getElementById('vid');function playM(i){cur=i;let m=MOVIES[i];document.getElementById('ptitle').innerText=m.orig+" - "+m.y+" [HD]";document.getElementById('player').classList.add('show');setQuality('480p');buildSug()}function setQuality(q){let m=MOVIES[cur];vid.src=`https://archive.org/download/${m.id}/${m.f}`;vid.play().catch(()=>{});document.getElementById('q480').classList.toggle('on',q==='480p');document.getElementById('q720').classList.toggle('on',q==='720p')}document.getElementById('q480').onclick=()=>setQuality('480p');document.getElementById('q720').onclick=()=>setQuality('720p');function closeP(){document.getElementById('player').classList.remove('show');vid.pause();vid.src=""}window.closeP=closeP;window.playM=playM;function buildSug(){let s=document.getElementById('srow');s.innerHTML="";MOVIES.filter((_,j)=>j!==cur).sort(()=>0.5-Math.random()).slice(0,15).forEach(mm=>{let idx=MOVIES.indexOf(mm);s.innerHTML+=`<div class="scard" onclick="playM(${idx})"><img src="https://archive.org/services/img/${mm.id}"><div>${mm.orig}</div></div>`})}</script></body></html>
