<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINIUS</title><style>body{margin:0;background:#000;color:#fff;font-family:Arial}.logo{color:#e50914;font-weight:900;font-size:26px;padding:15px}.hero{padding:30px 20px;background:#111}.btn{background:#e50914;color:#fff;border:none;padding:12px 24px;border-radius:4px;font-weight:bold}.grid{display:flex;flex-wrap:wrap;gap:12px;padding:15px}.card{width:160px;background:#181818;border-radius:6px;overflow:hidden}.card img{width:100%;height:90px;object-fit:cover}.name{padding:6px;font-size:11px;height:36px}#box{position:fixed;inset:0;background:#000;display:none;z-index:99;flex-direction:column}#box.show{display:flex}#box iframe{width:100%;flex:1;border:none}.x{position:absolute;top:10px;right:10px;background:#e50914;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:100}</style></head><body>
<div class="logo">VINIUS - REAL MOVIES</div>
<div class="hero"><h2>12 Real Full Movies - Tap to Watch</h2><p>No cartoons. Archive.org safe. No 0:00.</p><button class="btn" onclick="play(0)">▶ PLAY</button></div>
<div class="grid" id="g"></div>
<div id="box"><span class="x" onclick="closeP()">✕</span><iframe id="f" allowfullscreen></iframe></div>
<script>
const M=[
{id:"night-of-the-living-dead-1968-colorized",t:"Night of the Living Dead COLOR"},
{id:"house_on_haunted_hill",t:"House on Haunted Hill (1959)"},
{id:"TheLastManOnEarth_201403",t:"The Last Man on Earth"},
{id:"Plan9FromOuterSpace",t:"Plan 9 From Outer Space"},
{id:"CarnivalOfSouls",t:"Carnival of Souls"},
{id:"Nosferatu1922",t:"Nosferatu (1922)"},
{id:"Charade_1963",t:"Charade - Audrey Hepburn"},
{id:"HisGirlFriday",t:"His Girl Friday"},
{id:"WhiteZombie1932",t:"White Zombie"},
{id:"TheGeneral1926",t:"The General - Buster Keaton"},
{id:"Scarlet_Street_1945",t:"Scarlet Street"},
{id:"TheLittleShopOfHorrors",t:"Little Shop of Horrors"},
];
const g=document.getElementById('g');
M.forEach((m,i)=>{g.innerHTML+=`<div class="card" onclick="play(${i})"><img src="https://archive.org/services/img/${m.id}"><div class="name">${m.t}</div></div>`});
function play(i){document.getElementById('f').src="https://archive.org/embed/"+M[i].id;document.getElementById('box').classList.add('show');}
function closeP(){document.getElementById('box').classList.remove('show');document.getElementById('f').src='';}
</script></body></html>
