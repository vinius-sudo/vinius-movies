<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINIUS FINAL WORKING</title><style>body{margin:0;background:#080b12;color:#f5f7fb;font-family:Inter,sans-serif}header{padding:14px 5%;background:#080b12;border-bottom:1px solid #ffffff15;display:flex;gap:14px;align-items:center}.brand{font-weight:950}.brand span{color:#22e6a2}.search{margin-left:auto;width:420px;padding:11px 16px;border:1px solid #273449;border-radius:30px;background:#121a29;color:white}main{width:min(1240px,92%);margin:auto;padding:20px 0 60px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}.card{background:#151d2e;border:1px solid #ffffff12;border-radius:14px;overflow:hidden;cursor:pointer}.poster{height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;text-align:center}.info{padding:10px}.title{font-size:13px;font-weight:800;min-height:34px}.meta{font-size:10px;color:#a3afc2;margin:6px 0 8px}.watch{width:100%;border:0;border-radius:8px;background:#22e6a2;color:#042117;padding:9px;font-weight:900;cursor:pointer}#player{display:none;position:fixed;inset:0;z-index:50;background:#000000f2;align-items:center;justify-content:center;padding:12px}#player.open{display:flex}.box{width:min(1050px,100%);background:#0c111b;border:1px solid #ffffff25;border-radius:14px;overflow:hidden}.phead{display:flex;justify-content:space-between;padding:12px 16px;background:#141c2b}.close{width:32px;height:32px;border:0;border-radius:50%;background:#ffffff18;color:white;font-size:18px;cursor:pointer}.embed{aspect-ratio:16/9;background:#000}.embed iframe{width:100%;height:100%;border:0}</style></head><body>
<header><div class="brand">🎬 VINIUS <span>MOVIES</span></div><input id="search" class="search" placeholder="Search..."></header><main><div id="grid" class="grid"></div></main>
<div id="player"><div class="box"><div class="phead"><strong id="ptitle"></strong><button id="close" class="close">×</button></div><div class="embed"><iframe id="frm" allowfullscreen allow="autoplay;fullscreen"></iframe></div></div></div>
<script>
const ALL=[
{id:"night_of_the_living_dead",title:"Night of the Living Dead",year:"1968"},
{id:"CarnivalOfSouls1962",title:"Carnival of Souls",year:"1962"},
{id:"Sita_Sings_the_Blues",title:"Sita Sings the Blues",year:"2008"},
{id:"TheKid",title:"The Kid",year:"1921"},
{id:"Nosferatu",title:"Nosferatu",year:"1922"},
{id:"Metropolis_1927",title:"Metropolis, 1927",year:"1927"},
{id:"The_General_1926",title:"The General",year:"1926"},
{id:"SherlockJr",title:"Sherlock Jr",year:"1924"},
{id:"His_Girl_Friday_1940",title:"His Girl Friday",year:"1940"},
{id:"White_Zombie_1932",title:"White Zombie",year:"1932"},
{id:"House_on_Haunted_Hill_1959",title:"House on Haunted Hill",year:"1959"},
{id:"Detour_1945",title:"Detour",year:"1945"},
{id:"Scarlet_Street_1945",title:"Scarlet Street",year:"1945"},
{id:"The_Freshman_1925",title:"The Freshman",year:"1925"},
{id:"The_Gold_Rush_1925",title:"The Gold Rush",year:"1925"},
{id:"City_Lights_1931",title:"City Lights",year:"1931"},
{id:"The_Circus_1928",title:"The Circus",year:"1928"},
{id:"Safety_Last_1923",title:"Safety Last",year:"1923"}
];
function bg(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return `linear-gradient(135deg,hsl(${h},65%,22%),hsl(${(h+40)%360},75%,12%))`;}
function render(q=''){const f=ALL.filter(m=>m.title.toLowerCase().includes(q.toLowerCase()));document.getElementById('grid').innerHTML=f.map(m=>`<div class="card" onclick="play('${m.id}','${m.title.replace(/'/g,"\\'")}')"><div class="poster" style="background:${bg(m.id)}"><b>${m.title}</b><span>${m.year}</span></div><div class="info"><div class="title">${m.title}</div><div class="meta">${m.year}</div><button class="watch">▶ WATCH</button></div></div>`).join('');}
window.play=(id,title)=>{document.getElementById('ptitle').textContent=title;document.getElementById('frm').src='https://archive.org/embed/'+encodeURIComponent(id);document.getElementById('player').classList.add('open');}
document.getElementById('close').onclick=()=>{document.getElementById('player').classList.remove('open');document.getElementById('frm').src='';}
document.getElementById('player').onclick=e=>{if(e.target.id==='player'){document.getElementById('player').classList.remove('open');document.getElementById('frm').src='';}}
document.querySelector('.search').oninput=e=>render(e.target.value);
render();
</script></body></html>
