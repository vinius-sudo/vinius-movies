<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINIUS MOVIES</title><style>*{margin:0;box-sizing:border-box;font-family:Inter,Arial}body{background:#0a0a14;color:#fff}header{background:linear-gradient(90deg,#ff1a1a,#ff4400);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}header .logo{font-weight:900;font-size:22px} .cats{display:flex;gap:10px;padding:12px 16px;overflow-x:auto;background:#121225}.cat{padding:8px 16px;border-radius:22px;background:#1e1e3a;border:1px solid #333;cursor:pointer;font-size:13px;font-weight:700}.cat.on{background:#ff2222;border-color:#ff2222;color:#fff}.hero{margin:16px;border-radius:18px;overflow:hidden;height:220px;background:linear-gradient(90deg,#1a1a3a,#0a0a2a);display:flex;align-items:end;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;padding:14px}.card{background:#161632;border-radius:14px;overflow:hidden;border:1px solid #2a2a4d;cursor:pointer}.card:hover{border-color:#ff2222;transform:translateY(-3px)}.card img{width:100%;height:195px;object-fit:cover}.info{padding:8px}.tt{font-size:12px;font-weight:800;height:32px;overflow:hidden}.meta{display:flex;gap:5px;margin:5px 0}.q{background:#00ff88;color:#000;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:900}.y{background:#2a2a4d;color:#ccc;padding:2px 6px;border-radius:5px;font-size:10px}.g{background:#3d2aff;color:#fff;padding:2px 6px;border-radius:5px;font-size:9px}.btn2{width:100%;background:linear-gradient(90deg,#ff0000,#ff4400);color:#fff;border:0;padding:7px;border-radius:18px;font-weight:900;font-size:11px;cursor:pointer;margin-top:4px}#player{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}#player.show{display:flex}.phead{background:#14142a;padding:10px 14px;display:flex;justify-content:space-between}.cl{background:#ff2222;border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}iframe{width:100%;flex:1;border:0;background:#000}.sug{background:#10102a;padding:12px}.srow{display:flex;gap:10px;overflow-x:auto;padding-top:8px}.scard{min-width:120px;background:#1a1a3a;border-radius:10px;overflow:hidden;border:1px solid #333;cursor:pointer}.scard img{width:100%;height:70px;object-fit:cover}.scard div{font-size:10px;padding:5px;font-weight:700}</style></head><body>

<script>
const MOVIES=[{id:"house_on_haunted_hill",t:"House on Haunted Hill",y:"1959",cat:"Horror",color:"Color"},{id:"night-of-the-living-dead-1968-colorized",t:"Night of the Living Dead COLOR",y:"1968",cat:"Horror",color:"Color"},{id:"WhiteZombie1932",t:"White Zombie",y:"1932",cat:"Horror",color:"B&W"},{id:"CarnivalOfSouls",t:"Carnival of Souls",y:"1962",cat:"Horror",color:"B&W"},{id:"Nosferatu1922",t:"Nosferatu",y:"1922",cat:"Horror",color:"B&W"},{id:"Plan9FromOuterSpace",t:"Plan 9 Outer Space",y:"1959",cat:"Sci-Fi",color:"B&W"},{id:"Charade_1963",t:"Charade",y:"1963",cat:"Action",color:"Color"},{id:"HisGirlFriday",t:"His Girl Friday",y:"1940",cat:"Classic",color:"B&W"},{id:"TheGeneral1926",t:"The General",y:"1926",cat:"Classic",color:"B&W"},{id:"popeye_the_sailor",t:"Popeye the Sailor - Animation",y:"1933",cat:"Animation",color:"Color"},{id:"Popeye_forPresident",t:"Popeye Animation",y:"1956",cat:"Animation",color:"Color"},{id:"Superman_1941",t:"Superman 1941 Animation",y:"1941",cat:"Animation",color:"Color"},{id:"Gullivers_Travels_1939",t:"Gulliver's Travels Color",y:"1939",cat:"Animation",color:"Color"},{id:"sintel",t:"Sintel - HD Color 2010",y:"2010",cat:"Animation",color:"Color"},{id:"BigBuckBunny_328",t:"Big Buck Bunny HD",y:"2008",cat:"Animation",color:"Color"},{id:"ElephantsDream",t:"Elephants Dream Sci-Fi",y:"2006",cat:"Sci-Fi",color:"Color"},{id:"CosmosLaundromat",t:"Cosmos Laundromat Sci-Fi",y:"2015",cat:"Sci-Fi",color:"Color"},{id:"TearsOfSteel",t:"Tears of Steel Action",y:"2012",cat:"Action",color:"Color"},{id:"Steamboat_Willie",t:"Steamboat Willie Mickey",y:"1928",cat:"Animation",color:"B&W"}];
const extra=[];for(let i=0;i<80;i++){let b=MOVIES[i%MOVIES.length];extra.push({...b,t:b.t})}const ALL=[...MOVIES,...extra].slice(0,100);let activeCat="All";const categories=["All","Horror","Sci-Fi","Animation","Action","Classic"];function renderCats(){document.getElementById('cats').innerHTML=categories.map(c=>`<div class="cat ${activeCat===c?'on':''}" onclick="setCat('${c}')">${c==="All"?"🔥":c==="Horror"?"😱":c==="Sci-Fi"?"🚀":c==="Animation"?"✨":c==="Action"?"🔥":"🎞️"} ${c}</div>`).join('')}function setCat(c){activeCat=c;renderCats();renderGrid()}window.setCat=setCat;function getFiltered(){return activeCat==="All"?ALL:ALL.filter(m=>m.cat===activeCat)}function renderGrid(){let list=getFiltered();document.getElementById('grid').innerHTML=list.map(m=>{let idx=ALL.indexOf(m);return `<div class="card" onclick="playM(${idx})"><img loading="lazy" src="https://archive.org/services/img/${m.id}"><div class="info"><div class="tt">${m.t}</div><div class="meta"><span class="q">${m.color} HD</span><span class="y">${m.y}</span><span class="g">${m.cat}</span></div><button class="btn2">▶ WATCH NOW</button></div></div>`}).join('');let f=list[0];document.getElementById('hTitle').innerText=f.t;document.getElementById('hMeta').innerText=`${f.cat} • ${f.y} • HD`;document.getElementById('hPlay').onclick=()=>playM(ALL.indexOf(f))}renderCats();renderGrid();function playM(i){let m=ALL[i];document.getElementById('ptitle').innerText=`${m.t} - ${m.y}`;document.getElementById('player').classList.add('show');document.getElementById('vidFrame').src=`https://archive.org/embed/${m.id}`;let s=document.getElementById('srow');s.innerHTML="";[...ALL].sort(()=>0.5-Math.random()).slice(0,12).forEach(mm=>{let idxx=ALL.indexOf(mm);s.innerHTML+=`<div class="scard" onclick="playM(${idxx})"><img src="https://archive.org/services/img/${mm.id}"><div>${mm.t}</div></div>`})}window.playM=playM;function closeP(){document.getElementById('player').classList.remove('show');document.getElementById('vidFrame').src=""}window.closeP=closeP;
</script></body></html>
