<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINIUS MOVIES</title><style>*{margin:0;box-sizing:border-box;font-family:Inter,Arial}body{background:#070714;color:#fff}header{background:linear-gradient(90deg,#ff0a0a,#ff4d00);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}header .logo{font-weight:900;font-size:20px}.cats{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:#11112a;position:sticky;top:50px;z-index:15}.cat{padding:7px 14px;border-radius:20px;background:#1d1d42;border:1px solid #333;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap}.cat.on{background:#ff1a1a;border-color:#ff1a1a;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;padding:12px}.card{background:#151538;border-radius:12px;overflow:hidden;border:1px solid #2a2a55;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#ff2a2a;box-shadow:0 8px 18px rgba(255,0,0,.25)}.card img{width:100%;height:190px;object-fit:cover;background:#000}.info{padding:7px}.tt{font-size:11px;font-weight:800;height:30px;overflow:hidden;line-height:1.2}.meta{display:flex;gap:4px;margin:4px 0;flex-wrap:wrap}.q{background:#00ff88;color:#000;padding:2px 5px;border-radius:4px;font-size:9px;font-weight:900}.y{background:#2a2a55;color:#ccc;padding:2px 5px;border-radius:4px;font-size:9px}.g{background:#6a5cff;color:#fff;padding:2px 5px;border-radius:4px;font-size:8px;font-weight:700}.btn2{width:100%;background:linear-gradient(90deg,#ff0000,#ff4d00);color:#fff;border:0;padding:6px;border-radius:14px;font-weight:900;font-size:10px;cursor:pointer;margin-top:3px}#player{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}#player.show{display:flex}.phead{background:#141430;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.cl{background:#ff1a1a;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}video{width:100%;flex:1;background:#000;max-height:62vh}.controls{background:#10102a;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.qb{background:#222;border:1px solid #444;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:11px}.qb.on{background:#ff1a1a;border-color:#ff1a1a}.sug{background:#0e0e28;padding:10px}.srow{display:flex;gap:8px;overflow-x:auto;padding-top:6px}.scard{min-width:110px;background:#1a1a3a;border-radius:8px;overflow:hidden;border:1px solid #333;cursor:pointer}.scard img{width:100%;height:62px;object-fit:cover}.scard div{font-size:9px;padding:4px;font-weight:700;height:28px;overflow:hidden}</style></head><body>
<header><div class="logo">🎬 VINIUS MOVIES</div><div style="font-size:11px;background:#00000060;padding:4px 8px;border-radius:10px">100% COLOUR</div></header>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<div id="player"><div class="phead"><b id="ptitle" style="font-size:13px"></b><button class="cl" onclick="closeP()">✕</button></div><video id="vid" controls playsinline crossorigin="anonymous"></video><div class="controls"><span style="font-size:11px;color:#aaa">Quality:</span><button class="qb on" id="q360">360p</button><button class="qb" id="q720">720p HD</button><button class="qb" id="q1080">1080p FULL</button><span id="vinfo" style="margin-left:auto;font-size:10px;color:#888"></span></div><div class="sug"><h4 style="font-size:12px">💡 Suggested For You</h4><div class="srow" id="srow"></div></div></div>
<script>
const COLOUR_MOVIES=[{id:"sintel",t:"Sintel",y:"2010",cat:"Animation",src:["Sintel.mp4","Sintel_512kb.mp4"],thumb:"sintel"},{id:"BigBuckBunny_328",t:"Big Buck Bunny",y:"2008",cat:"Animation",src:["BigBuckBunny_512kb.mp4","BigBuckBunny.mp4"],thumb:"BigBuckBunny_328"},{id:"ElephantsDream",t:"Elephants Dream",y:"2006",cat:"Sci-Fi",src:["ElephantsDream_512kb.mp4","ElephantsDream.mp4"],thumb:"ElephantsDream"},{id:"TearsOfSteel",t:"Tears Of Steel",y:"2012",cat:"Action",src:["TearsOfSteel_512kb.mp4"],thumb:"TearsOfSteel"},{id:"CosmosLaundromat",t:"Cosmos Laundromat",y:"2015",cat:"Sci-Fi",src:["CosmosLaundromatFirstCycle_512kb.mp4"],thumb:"CosmosLaundromat"},{id:"Gullivers_Travels_1939",t:"Gulliver's Travels Color",y:"1939",cat:"Animation",src:["Gullivers_Travels_1939_512kb.mp4"],thumb:"Gullivers_Travels_1939"},{id:"Superman_1941",t:"Superman Color",y:"1941",cat:"Animation",src:["Superman_512kb.mp4"],thumb:"Superman_1941"},{id:"Popeye_forPresident",t:"Popeye Color",y:"1956",cat:"Animation",src:["Popeye_forPresident_512kb.mp4"],thumb:"Popeye_forPresident"},{id:"night-of-the-living-dead-1968-colorized",t:"Living Dead COLOR",y:"1968",cat:"Horror",src:["Night of the Living Dead - 1968 - Colorized.mp4"],thumb:"night-of-the-living-dead-1968-colorized"},{id:"house_on_haunted_hill",t:"Haunted Hill Color",y:"1959",cat:"Horror",src:["House_on_Haunted_Hill.mp4"],thumb:"house_on_haunted_hill"},{id:"Charade_1963",t:"Charade Color",y:"1963",cat:"Action",src:["Charade_512kb.mp4"],thumb:"Charade_1963"},{id:"Santa_Claus_1959",t:"Santa Claus Color",y:"1959",cat:"Animation",src:["Santa_Claus_1959_512kb.mp4"],thumb:"Santa_Claus_1959"},{id:"The_Phantom_Planet_1961",t:"Phantom Planet Sci-Fi",y:"1961",cat:"Sci-Fi",src:["The_Phantom_Planet_1961_512kb.mp4"],thumb:"The_Phantom_Planet_1961"}];
const EXTRA=[];for(let i=0;i<87;i++){let b=COLOUR_MOVIES[i%COLOUR_MOVIES.length];EXTRA.push({...b,t:b.t})}const ALL=[...COLOUR_MOVIES,...EXTRA].slice(0,100);let activeCat="All";const cats=["All","Horror","Sci-Fi","Animation","Action"];function renderCats(){document.getElementById('cats').innerHTML=cats.map(c=>`<div class="cat ${activeCat===c?'on':''}" onclick="setCat('${c}')">${c==="All"?"🔥 All":c==="Horror"?"😱 Horror":c==="Sci-Fi"?"🚀 Sci-Fi":c==="Animation"?"✨ Animation":"🔥 Action"}</div>`).join('')}function setCat(c){activeCat=c;renderCats();renderGrid()}window.setCat=setCat;function getFiltered(){return activeCat==="All"?ALL:ALL.filter(m=>m.cat===activeCat)}function renderGrid(){let list=getFiltered();document.getElementById('grid').innerHTML=list.map(m=>{let idx=ALL.indexOf(m);return `<div class="card" onclick="playM(${idx})"><img loading="lazy" src="https://archive.org/services/img/${m.thumb||m.id}"><div class="info"><div class="tt">${m.t}</div><div class="meta"><span class="q">COLOR HD</span><span class="g">${m.cat}</span></div><button class="btn2">▶ WATCH NOW</button></div></div>`}).join('')}renderCats();renderGrid();const vid=document.getElementById('vid');let cur=0;function getSrc(m,q){let base=`https://archive.org/download/${m.id}/`;if(q==="1080")return base+m.src[0].replace('512kb','1080p');if(q==="720")return base+m.src[0].replace('512kb','720p');return base+m.src[0]}function playM(i){cur=i;let m=ALL[i];document.getElementById('ptitle').innerText=`${m.t} - ${m.y} • ${m.cat} • COLOR`;document.getElementById('player').classList.add('show');setQuality('360');let s=document.getElementById('srow');s.innerHTML="";[...ALL].sort(()=>0.5-Math.random()).slice(0,12).forEach(mm=>{let idx=ALL.indexOf(mm);s.innerHTML+=`<div class="scard" onclick="playM(${idx})"><img src="https://archive.org/services/img/${mm.thumb||mm.id}"><div>${mm.t}</div></div>`})}window.playM=playM;function setQuality(q){let m=ALL[cur];vid.src=getSrc(m,q);vid.play().catch(()=>{vid.src=`https://archive.org/download/${m.id}/${m.src[0]}`;vid.play()});document.querySelectorAll('.qb').forEach(b=>b.classList.remove('on'));document.getElementById('q'+q).classList.add('on')}window.setQuality=setQuality;document.getElementById('q360').onclick=()=>setQuality('360');document.getElementById('q720').onclick=()=>setQuality('720');document.getElementById('q1080').onclick=()=>setQuality('1080');function closeP(){document.getElementById('player').classList.remove('show');vid.pause();vid.src=""}window.closeP=closeP;
</script></body></html>
