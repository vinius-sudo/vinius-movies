<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINIUS MOVIES</title><style>*{margin:0;box-sizing:border-box;font-family:Arial}body{background:#08081a;color:#fff}header{background:linear-gradient(90deg,#ff0a0a,#ff4d00);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}header .logo{font-weight:900;font-size:19px}.cats{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:#11112a}.cat{padding:7px 14px;border-radius:20px;background:#1d1d42;border:1px solid #333;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap}.cat.on{background:#ff1a1a;border-color:#ff1a1a;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;padding:12px}.card{background:#151538;border-radius:12px;overflow:hidden;border:1px solid #2a2a55;cursor:pointer}.card img{width:100%;height:180px;object-fit:cover;background:#000}.info{padding:7px}.tt{font-size:11px;font-weight:800;height:30px;overflow:hidden}.meta{display:flex;gap:4px;margin:4px 0}.q{background:#00ff88;color:#000;padding:2px 5px;border-radius:4px;font-size:9px;font-weight:900}.g{background:#6a5cff;color:#fff;padding:2px 5px;border-radius:4px;font-size:8px}.btn2{width:100%;background:linear-gradient(90deg,#ff0000,#ff4d00);color:#fff;border:0;padding:6px;border-radius:14px;font-weight:900;font-size:10px;cursor:pointer}#player{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}#player.show{display:flex}.phead{background:#141430;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.cl{background:#ff1a1a;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}video{width:100%;flex:1;background:#000;max-height:65vh}.controls{background:#10102a;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.qb{background:#222;border:1px solid #444;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:11px}.qb.on{background:#ff1a1a}.sug{background:#0e0e28;padding:10px}.srow{display:flex;gap:8px;overflow-x:auto;padding-top:6px}.scard{min-width:110px;background:#1a1a3a;border-radius:8px;overflow:hidden;border:1px solid #333;cursor:pointer}.scard img{width:100%;height:62px;object-fit:cover}.scard div{font-size:9px;padding:4px;font-weight:700;height:28px;overflow:hidden}</style></head><body>
<header><div class="logo">🎬 VINIUS MOVIES</div><div style="font-size:11px;background:#0005;padding:4px 8px;border-radius:10px">COLOR FIXED ✅</div></header>

<script>
const MOVIES=[{t:"Big Buck Bunny - Animation COLOR",y:"2008",cat:"Animation",img:"https://peach.blender.org/wp-content/uploads/title_anouncement.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"},{t:"Elephant Dream - Sci-Fi COLOR",y:"2006",cat:"Sci-Fi",img:"https://orange.blender.org/wp-content/themes/orange/images/common/ed_header.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4"},{t:"For Bigger Blazes - Action COLOR",y:"2020",cat:"Action",img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerBlazes.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"},{t:"For Bigger Escapes - Adventure COLOR",y:"2020",cat:"Action",img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerEscapes.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"},{t:"For Bigger Fun - Comedy COLOR",y:"2020",cat:"Animation",img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerFun.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"},{t:"For Bigger Joyrides - Sci-Fi COLOR",y:"2020",cat:"Sci-Fi",img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerJoyrides.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"},{t:"For Bigger Meltdowns - Horror COLOR",y:"2020",cat:"Horror",img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerMeltdowns.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4"},{t:"Sintel - Fantasy Animation COLOR",y:"2010",cat:"Animation",img:"https://durian.blender.org/wp-content/uploads/2010/05/sintel_poster.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"},{t:"Subaru Outback - Adventure COLOR",y:"2020",cat:"Action",img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/SubaruOutbackOnStreetAndDirt.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/SubaruOutbackOnStreetAndDirt.mp4"},{t:"Tears of Steel - Sci-Fi Action COLOR",y:"2012",cat:"Action",img:"https://mango.blender.org/wp-content/uploads/2013/05/01_thom_celia_bridge.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"},{t:"We Are Going On Bullrun - Horror COLOR",y:"2020",cat:"Horror",img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/WeAreGoingOnBullrun.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/WeAreGoingOnBullrun.mp4"},{t:"Sintel Trailer HD COLOR",y:"2010",cat:"Animation",img:"https://durian.blender.org/wp-content/uploads/2010/05/sintel_poster.jpg",src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"}];
const ALL=[];for(let i=0;i<100;i++){let b=MOVIES[i%MOVIES.length];ALL.push({t:b.t+(i>=MOVIES.length?" "+(Math.floor(i/MOVIES.length)+1):""),y:b.y,cat:b.cat,img:b.img,src:b.src});}
let activeCat="All";const cats=["All","Horror","Sci-Fi","Animation","Action","Classic"];function renderCats(){document.getElementById('cats').innerHTML=cats.map(c=>`<div class="cat ${activeCat===c?'on':''}" onclick="setCat('${c}')">${c==="All"?"🔥 All":c==="Horror"?"😱 Horror":c==="Sci-Fi"?"🚀 Sci-Fi":c==="Animation"?"✨ Animation":c==="Action"?"🔥 Action":"🎞️ Classic"}</div>`).join('');}function setCat(c){activeCat=c;renderCats();renderGrid();}window.setCat=setCat;function getFiltered(){return activeCat==="All"?ALL:ALL.filter(m=>m.cat===activeCat);}function renderGrid(){let list=getFiltered();document.getElementById('grid').innerHTML=list.map(m=>{let idx=ALL.indexOf(m);return `<div class="card" onclick="playM(${idx})"><img src="${m.img}" onerror="this.src='https://via.placeholder.com/200x300/ff2222/fff?text=COLOR'"><div class="info"><div class="tt">${m.t}</div><div class="meta"><span class="q">${m.y} COLOR</span><span class="g">${m.cat}</span></div><button class="btn2">▶ WATCH NOW</button></div></div>`}).join('');}renderCats();renderGrid();const vid=document.getElementById('vid');let cur=0;function playM(i){cur=i;let m=ALL[i];document.getElementById('ptitle').innerText=`${m.t} - ${m.y} • ${m.cat}`;document.getElementById('player').classList.add('show');vid.src=m.src;vid.play();let s=document.getElementById('srow');s.innerHTML="";[...ALL].sort(()=>0.5-Math.random()).slice(0,12).forEach(mm=>{let idx=ALL.indexOf(mm);if(idx===cur)return;s.innerHTML+=`<div class="scard" onclick="playM(${idx})"><img src="${mm.img}"><div>${mm.t}</div></div>`});}window.playM=playM;function closeP(){document.getElementById('player').classList.remove('show');vid.pause();vid.src="";}window.closeP=closeP;
</script></body></html>
