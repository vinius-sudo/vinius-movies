ground:#ff1a1a}.cl{width:34px;height:34px;background:#ff1a1a;border:0;border-radius:50%;color:#fff;font-size:18px;cursor:pointer}video{width:100%;flex:1;background:#000;max-height:55vh}.sug{background:#0f0f1f;padding:12px;flex:1;overflow-y:auto}.srow{display:flex;gap:9px;overflow-x:auto}.scard{min-width:108px;background:#1c1c30;border-radius:10px;overflow:hidden;border:1px solid #2a2a45;cursor:pointer}.scard img{width:100%;height:64px;object-fit:cover}.scard div{font-size:10px;padding:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><header><div class=logo>VINIUS<b>.MOVIES</b></div><input id=search class=srch placeholder="Search 100 movies..." oninput=filter()></header><div class=hero><h1>100 Classic Movies Free</h1><p>Watch Now • HD Quality • No Archive Redirect • Friendly Colours</p></div><div class=grid id=grid></div><div id=player><div class=phead><h3 id=ptitle></h3><div><button class=qb id=q480 onclick=setQ('480')>480p</button><button class=qb id=q720 onclick=setQ('720')>HD</button><button class=cl onclick=closeP()>✕</button></div></div><video id=vid controls playsinline></video><div class=sug><h4>💡 Suggested For You - Keep Watching</h4><div class=srow id=srow></div><p style=margin-top:10px;font-size:11px;color:#666>Colour quality: RED=Watch Now, GREEN=HD Available. No external links.</p></div></div><script>const MOVIES=[{id:"house_on_haunted_hill",t:"House on Haunted Hill",y:"1959",f:"House_on_Haunted_Hill.mp4"},{id:"night-of-the-living-dead-1968-colorized",t:"Night of Living Dead Color",y:"1968",f:"Night of the Living Dead - 1968 - Colorized.mp4"},{id:"Plan9FromOuterSpace",t:"Plan 9 Outer Space",y:"1959",f:"Plan9FromOuterSpace_512kb.mp4"},{id:"CarnivalOfSouls",t:"Carnival of Souls",y:"1962",f:"CarnivalOfSouls_512kb.mp4"},{id:"Nosferatu1922",t:"Nosferatu",y:"1922",f:"Nosferatu1922_512kb.mp4"},{id:"Charade_1963",t:"Charade",y:"1963",f:"Charade_512kb.mp4"},{id:"HisGirlFriday",t:"His Girl Friday",y:"1940",f:"HisGirlFriday_512kb.m
