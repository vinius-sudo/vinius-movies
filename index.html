<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinius Movies - Netflix Clone</title>
<style>
body{background:#000;color:#fff;margin:0;font-family:Arial}
h2{margin:20px 10px}
.row{display:flex;overflow-x:auto;gap:10px;padding:10px}
.card{min-width:180px;height:260px;background:#111;border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;height:100%;object-fit:cover}
.card .title{position:absolute;bottom:0;background:linear-gradient(transparent,black);width:100%;padding:10px}
#player{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:none;z-index:100;align-items:center;justify-content:center;flex-direction:column}
#player video{width:90%;max-width:800px;max-height:70vh;background:#000}
#close{position:absolute;top:20px;right:20px;font-size:30px;cursor:pointer}
</style>
</head>
<body>
<div id="player">
<span id="close" onclick="document.getElementById('player').style.display='none';document.getElementById('vid').pause()">✕</span>
<h2 id="movieTitle">Now Playing</h2>
<video id="vid" controls autoplay playsinline></video>
</div>

<h2>🔥 Trending Now</h2>
<div class="row" id="trending"></div>

<h2>🎬 Public Domain Classics</h2>
<div class="row" id="classics"></div>

<h2>🎨 Animation - Pixar Style</h2>
<div class="row" id="anim"></div>

<script>
const movies=[
{title:"Big Buck Bunny",cat:"trending",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",thumb:"https://peach.blender.org/wp-content/uploads/bunny_poster.jpg"},
{title:"Tears of Steel",cat:"classics",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",thumb:"https://mango.blender.org/wp-content/uploads/2013/05/01_thom_celia_bridge.jpg"},
{title:"Sintel",cat:"trending",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",thumb:"https://durian.blender.org/wp-content/uploads/2010/05/sintel_poster.jpg"},
{title:"Elephant Dream",cat:"anim",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",thumb:"https://orange.blender.org/wp-content/themes/orange/images/common/ed_header.jpg"},
{title:"For Bigger Blazes",cat:"trending",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",thumb:"https://peach.blender.org/wp-content/uploads/title_anouncement.jpg"},
{title:"Night of the Living Dead",cat:"classics",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",thumb:"https://upload.wikimedia.org/wikipedia/commons/3/32/Night_of_the_Living_Dead_%281968%29_theatrical_poster.jpg"}
];
function play(m){
 document.getElementById('movieTitle').innerText=m.title;
 document.getElementById('vid').src=m.video;
 document.getElementById('player').style.display='flex';
 document.getElementById('vid').play();
}
movies.forEach(m=>{
 let d=document.createElement('div');
 d.className='card';
 d.innerHTML=`<img src="${m.thumb}" onerror="this.src='https://via.placeholder.com/180x260/111/fff?text=${m.title}'"><div class="title">${m.title}</div>`;
 d.onclick=()=>play(m);
 document.getElementById(m.cat).appendChild(d);
});
</script>
</body>
</html>
