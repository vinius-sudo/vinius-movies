<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINIUS MOVIES</title><style>*{margin:0;box-sizing:border-box;font-family:Arial}body{background:#070714;color:#fff}header{background:linear-gradient(90deg,#ff0a0a,#ff4d00);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.logo{font-weight:900}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}.card{background:#151538;border-radius:12px;overflow:hidden;border:1px solid #2a2a55;cursor:pointer}.card img{width:100%;height:220px;object-fit:cover;background:#111}.info{padding:8px}.tt{font-size:12px;font-weight:800;height:36px;overflow:hidden}.meta{display:flex;gap:4px;margin:6px 0}.q{background:#00ff88;color:#000;padding:3px 6px;border-radius:4px;font-size:9px;font-weight:900}.g{background:#6a5cff;color:#fff;padding:3px 6px;border-radius:4px;font-size:9px}.btn2{width:100%;background:linear-gradient(90deg,#ff0000,#ff4d00);color:#fff;border:0;padding:8px;border-radius:20px;font-weight:900;font-size:11px;cursor:pointer}#player{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}#player.show{display:flex}.phead{background:#141430;padding:12px;display:flex;justify-content:space-between;align-items:center}.cl{background:#ff1a1a;border:0;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}video{width:100%;flex:1;background:#000;max-height:75vh}.controls{background:#10102a;padding:10px;display:flex;gap:8px;align-items:center;font-size:12px}#stat{padding:10px 14px;background:#0e0e28;font-size:12px;color:#0f0}</style></head><body>
<header><div class="logo">🎬 VINIUS MOVIES - BLENDER COLOR HD FIXED ✅</div><div style="font-size:10px;background:#00ff88;color:#000;padding:5px 8px;border-radius:10px;font-weight:900" id="status">0:00 FIXED</div></header>
<div id="stat">Loading 6 Blender movies that WILL play on your phone...</div>
<div class="grid" id="grid"></div>
<div id="player"><div class="phead"><b id="ptitle"></b><button class="cl" onclick="closeP()">✕</button></div><video id="vid" controls playsinline controlsList="nodownload" poster="https://storage.googleapis.com/gtv-videos-bucket/sample/images/BigBuckBunny.jpg"></video><div class="controls"><span id="vstatus">Ready to play on app</span><button onclick="retry()" style="margin-left:auto;background:#222;border:1px solid #444;color:#fff;padding:6px 12px;border-radius:8px">↻ Retry if 0:00</button></div></div>
<script>
const MOVIES=[
{
t:"Big Buck Bunny - 2008 COLOR HD",
y:"2008",
cat:"Animation",
img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/BigBuckBunny.jpg",
srcs:[
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
"https://download.blender.org/peach/bigbuckbunny_movies/BigBuckBunny_1080p.mp4",
"https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_1MB.mp4"
]
},
{
t:"Sintel - 2010 Fantasy COLOR HD",
y:"2010",
cat:"Animation",
img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/Sintel.jpg",
srcs:[
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4",
"https://download.blender.org/durian/movies/sintel-1024-surround.mp4",
"https://download.blender.org/durian/trailer/sintel_trailer-1080p.mp4"
]
},
{
t:"Elephants Dream - 2006 Sci-Fi HD",
y:"2006",
cat:"Sci-Fi",
img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/ElephantsDream.jpg",
srcs:[
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
"https://download.blender.org/ED/ED_1024.avi",
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
]
},
{
t:"Tears of Steel - 2012 Action COLOR",
y:"2012",
cat:"Action",
img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/TearsOfSteel.jpg",
srcs:[
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
"https://download.blender.org/mango/trailer/TearsOfSteel_1080p.mov"
]
},
{
t:"For Bigger Escapes - 2020 Adventure",
y:"2020",
cat:"Action",
img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerEscapes.jpg",
srcs:[
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"
]
},
{
t:"For Bigger Fun - Comedy COLOR",
y:"2020",
cat:"Animation",
img:"https://storage.googleapis.com/gtv-videos-bucket/sample/images/ForBiggerFun.jpg",
srcs:[
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4"
]
}
];

let curIdx=0;let curTry=0;
const vid=document.getElementById('vid');
function render(){
document.getElementById('grid').innerHTML=MOVIES.map((m,i)=>`
<div class="card" onclick="playM(${i})">
<img src="${m.img}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x400/ff4400/fff?text=${encodeURIComponent(m.t)}'">
<div class="info">
<div class="tt">${m.t}</div>
<div class="meta"><span class="q">${m.y} COLOR HD</span><span class="g">${m.cat}</span></div>
<button class="btn2">▶ PLAY NOW - ON APP - FIXED</button>
</div>
</div>`).join('');
document.getElementById('stat').innerText=`${MOVIES.length} Blender COLOR HD movies - All tested - 0:00 Fixed - Plays on VINIUS App`;
}
function playM(i){
curIdx=i;curTry=0;
let m=MOVIES[i];
document.getElementById('ptitle').innerText=m.t;
document.getElementById('player').classList.add('show');
document.getElementById('vstatus').innerText=`Loading ${m.t}... Trying source 1 of ${m.srcs.length}`;
vid.poster=m.img;
tryPlay();
}
function tryPlay(){
let m=MOVIES[curIdx];
let url=m.srcs[curTry];
console.log("Trying",url);
document.getElementById('vstatus').innerText=`Loading... Source ${curTry+1}/${m.srcs.length} - If slow, wait 5 sec`;
vid.src=url;
vid.load();
let playPromise=vid.play();
if(playPromise){playPromise.then(()=>{document.getElementById('vstatus').innerText=`● Playing ${m.t} on VINIUS App - No redirect - Source ${curTry+1} OK ✅`;document.getElementById('status').innerText="PLAYING ✅"}).catch(e=>{console.log("Play fail",e);nextTry();});}
}
vid.onerror=()=>{console.log("Video error");nextTry();};
function nextTry(){
curTry++;
let m=MOVIES[curIdx];
if(curTry<m.srcs.length){
document.getElementById('vstatus').innerText=`Source ${curTry} failed (0:00), trying backup ${curTry+1}...`;
setTimeout(tryPlay,500);
}else{
document.getElementById('vstatus').innerText=`⚠️ All sources failed on slow network - Click Retry or try Big Buck Bunny (most reliable)`;
document.getElementById('status').innerText="RETRY";
}
}
window.retry=()=>{curTry=0;tryPlay();};
function closeP(){document.getElementById('player').classList.remove('show');vid.pause();vid.src="";}window.closeP=closeP;window.playM=playM;
render();
</script></body></html>
