<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINIUS MOVIES</title>
<style>
:root{--bg:#07080e;--panel:#111321;--panel2:#181a2e;--line:#232643;--text:#f5f6ff;--muted:#9aa0b8;--green:#00f5a0;--red:#ff3b5c}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:14px 20px;background:#07080ee6;backdrop-filter:blur(22px);border-bottom:1px solid #ffffff10}
.brand{font-weight:950;font-size:22px;letter-spacing:-1px}.brand b{color:var(--green)}
.nav{display:flex;gap:18px;margin-left:10px}.nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}.nav a.active{color:var(--text);border-bottom:2px solid var(--green);padding-bottom:3px}
.search{margin-left:auto;position:relative;max-width:300px;width:100%}.search input{width:100%;background:#14162a;border:1px solid var(--line);border-radius:24px;padding:11px 15px 11px 40px;color:white;outline:none;font-size:13px}.s-icon{position:absolute;left:14px;top:11px;color:var(--muted)}
main{padding:10px 4vw 40px}
.head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;flex-wrap:wrap;gap:8px}
.head h2{font-size:14px;color:var(--muted);font-weight:600}
.filters{display:flex;gap:8px;overflow:auto;padding-bottom:14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;background:#151827;border:1px solid var(--line);color:#c9ccdf;padding:10px 16px;border-radius:24px;font-size:13px;font-weight:800;cursor:pointer;transition:.2s}
.filter.active{background:var(--green);color:#00140e;border-color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid #ffffff12;border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#00f5a055;box-shadow:0 12px 28px #0008}
.poster{height:230px;position:relative;background:#0f1222;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.quality{position:absolute;top:10px;left:10px;background:var(--green);color:#00140e;border-radius:6px;padding:5px 8px;font-size:10px;font-weight:900;z-index:2}
.fav{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:#0008;backdrop-filter:blur(8px);border:1px solid #ffffff22;color:white;display:grid;place-items:center;font-size:14px;z-index:2}
.fav.liked{color:var(--red);background:#ff3b5c22;border-color:#ff3b5c55}
.duration{position:absolute;bottom:10px;right:10px;background:#000e;border:1px solid #ffffff30;color:#fff;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:800;z-index:2}
.info{padding:12px}
.title{font-size:13px;font-weight:800;line-height:1.3;height:36px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:11px;color:var(--muted);margin:8px 0;display:flex;gap:6px;align-items:center}
.actions{display:flex;gap:14px;margin:8px 0;color:var(--muted);font-size:11px;align-items:center}
.actions b{display:flex;gap:4px;align-items:center;font-weight:700}
.play{width:100%;border:0;border-radius:10px;padding:12px;background:var(--green);color:#00140e;font-size:11px;font-weight:950;margin-top:6px;cursor:pointer}

/* PLAYER WITH FORWARD/BACKWARD + BRIGHT + VOLUME - NO DESCRIPTION */
#player{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
#player.open{display:flex}
.p-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#0f1120;border-bottom:1px solid #ffffff12}
.p-head strong{font-size:13px;max-width:75%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close{border:0;border-radius:50%;width:32px;height:32px;background:var(--red);color:white;font-size:18px;cursor:pointer}
.v-wrap{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.v-wrap video{width:100%;height:100%;max-height:100%;object-fit:contain;transition:filter 0.2s}
.controls{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:14px;background:linear-gradient(0deg,rgba(0,0,0,0.9) 0%,transparent 35%,transparent 65%,rgba(0,0,0,0.6) 100%);opacity:1;transition:0.3s}
.controls.hide{opacity:0;pointer-events:none}
.center-controls{display:flex;align-items:center;justify-content:center;gap:20px;flex:1}
.ctrl-btn{width:54px;height:54px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff25;color:white;font-size:20px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px)}
.ctrl-btn.big{width:68px;height:68px;background:var(--green);color:#00140e;border-color:var(--green);font-size:28px}
.ctrl-btn:active{transform:scale(0.92)}
.bottom-controls{padding:8px 2px 2px}
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.progress{flex:1;height:5px;background:#ffffff30;border-radius:5px;position:relative;cursor:pointer}
.progress-filled{height:100%;background:var(--green);border-radius:5px;width:0%}
.time{font-size:11px;color:#ffffffcc;min-width:90px;text-align:right}
.bottom-row{display:flex;justify-content:space-between;align-items:center}
.tools{display:flex;gap:8px}
.tool{width:36px;height:36px;border-radius:50%;background:#ffffff15;border:1px solid #ffffff20;color:white;display:grid;place-items:center;font-size:14px;cursor:pointer}
.sliders{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.slider-group{display:flex;align-items:center;gap:6px;background:#ffffff12;border:1px solid #ffffff15;padding:6px 12px;border-radius:20px}
.slider-group label{font-size:10px;color:#fff;min-width:45px}
.slider-group input{width:70px;accent-color:var(--green);height:4px}
@media(max-width:700px){.topbar{flex-wrap:wrap}.search{flex-basis:100%;order:3;max-width:none}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.poster{height:200px}}
</style>
</head>
<body>
<header class="topbar">
<div class="brand">VINIUS <b>MOVIES</b></div>
<nav class="nav">
<a class="active" onclick="setCat('all')">Home</a>
<a onclick="setCat('movies')">Full Movies</a>
<a onclick="setCat('cartoons')">Cartoons</a>
<a onclick="document.getElementById('watchlist').scrollIntoView({behavior:'smooth'})">My List</a>
</nav>
<div class="search"><span class="s-icon">⌕</span><input id="search" type="search" placeholder="Search 2000+ movies & cartoons..." autocomplete="off"></div>
</header>

<main>
<div class="head"><h2 id="count">118 titles - Tap Load More for 2000+</h2></div>
<div style="margin-bottom:12px"><button class="filter" id="loadBtn" onclick="loadMore()" style="background:#151827">Load More +500</button></div>
<div class="filters" id="filters">
<button class="filter active" data-cat="all">All 2000+</button>
<button class="filter" data-cat="movies">Full Movies (60-120min)</button>
<button class="filter" data-cat="cartoons">Big Cartoons</button>
<button class="filter" data-cat="short">Short</button>
</div>
<div class="grid" id="grid"></div>
<div style="text-align:center;margin:20px 0"><button class="filter" onclick="loadMore()">▶ LOAD MORE - Get to 2000+</button></div>
<div id="watchlist"><div class="head"><h2>♡ My List</h2></div><div class="grid" id="watchgrid"></div></div>
</main>

<div id="player">
<div class="p-head"><strong id="pTitle"></strong><button class="close" onclick="closePlayer()">×</button></div>
<div class="v-wrap" id="vWrap">
<video id="video" playsinline preload="auto"></video>
<div class="controls" id="controls">
<div style="display:flex;justify-content:space-between"><span id="pTime" style="font-size:10px;background:#0008;padding:4px 8px;border-radius:12px">00:00 / 00:00</span><span id="pQuality" style="font-size:10px;background:#00f5a01a;border:1px solid #00f5a033;color:var(--green);padding:4px 8px;border-radius:12px">1080p • On App</span></div>
<div class="center-controls">
<div class="ctrl-btn" onclick="seek(-10)">⏪<div style="font-size:8px">10</div></div>
<div class="ctrl-btn big" id="playBtn" onclick="togglePlay()">▶</div>
<div class="ctrl-btn" onclick="seek(10)">⏩<div style="font-size:8px">10</div></div>
</div>
<div class="bottom-controls">
<div class="progress-wrap"><div class="progress" id="progress" onclick="seekProgress(event)"><div class="progress-filled" id="progressFilled"></div></div><div class="time" id="timeDisplay">0:00 / 0:00</div></div>
<div class="bottom-row"><div class="tools"><div class="tool" onclick="toggleMute()" id="volTool">🔊</div><div class="tool" onclick="toggleFullscreen()">⛶</div><div class="tool" id="speedTool" onclick="changeSpeed()">1x</div></div><div class="tool" onclick="closePlayer()">✕</div></div>
<div class="sliders">
<div class="slider-group"><label>🔊 Vol</label><input type="range" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)"><span id="volVal" style="font-size:9px">100%</span></div>
<div class="slider-group"><label>☀️ Bright</label><input type="range" id="brightSlider" min="0.3" max="2" step="0.1" value="1" oninput="setBrightness(this.value)"><span id="brightVal" style="font-size:9px">100%</span></div>
<div class="slider-group"><label>⏩ Speed</label><input type="range" id="speedSlider" min="0.5" max="2" step="0.25" value="1" oninput="setSpeed(this.value)"><span id="speedVal" style="font-size:9px">1x</span></div>
</div>
</div>
</div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let activeCat='all',search='',current=null;
let saved=new Set(JSON.parse(localStorage.getItem('vinius-watchlist')||'[]'));
let likes=JSON.parse(localStorage.getItem('vinius-likes')||'{}');
let likeCounts=JSON.parse(localStorage.getItem('vinius-likeCounts')||'{}');

// THIS EXACT UI FROM YOUR SCREENSHOT - Sita Sings the Blues 844 min - McLintock 296 min etc - Real Archive posters
const BASE=[
{id:"Sita_Sings_the_Blues",title:"Sita Sings the Blues",year:"2008",durMin:844,dur:"844 min",isCart:true,poster:"https://archive.org/services/img/Sita_Sings_the_Blues",url:"https://archive.org/download/Sita_Sings_the_Blues/Sita_Sings_the_Blues_512kb.mp4",quality:"1080p"},
{id:"McLintock_1963",title:"McLintock!",year:"1963",durMin:296,dur:"296 min",isCart:false,poster:"https://archive.org/services/img/McLintock_1963",url:"https://archive.org/download/McLintock_1963/McLintock_1963_512kb.mp4",quality:"1080p"},
{id:"night_of_the_living_dead",title:"Night of the Living Dead",year:"1968",durMin:96,dur:"96 min",isCart:false,poster:"https://archive.org/services/img/night_of_the_living_dead",url:"https://archive.org/download/night_of_the_living_dead/night_of_the_living_dead_512kb.mp4",quality:"1080p"},
{id:"Gullivers_Travels_1939",title:"Gulliver's Travels",year:"1939",durMin:76,dur:"76 min",isCart:true,poster:"https://archive.org/services/img/GulliversTravels",url:"https://archive.org/download/GulliversTravels/Gullivers_Travels_1939_512kb.mp4",quality:"720p"},
{id:"Popeye_Meets_Ali_Baba",title:"Popeye Meets Ali Baba",year:"1937",durMin:16,dur:"16 min",isCart:true,poster:"https://archive.org/services/img/Popeye_the_Sailor_Meets_Ali_Babas_Forty_Thieves",url:"https://archive.org/download/Popeye_the_Sailor_Meets_Ali_Babas_Forty_Thieves/Popeye_the_Sailor_Meets_Ali_Babas_Forty_Thieves_512kb.mp4",quality:"720p"},
{id:"Betty_Boop_Snow_White",title:"Betty Boop - Snow White",year:"1933",durMin:7,dur:"7 min",isCart:true,poster:"https://archive.org/services/img/Betty_Boop_Snow_White",url:"https://archive.org/download/Betty_Boop_Snow_White/Betty_Boop_Snow_White_512kb.mp4",quality:"480p"},
{id:"The_Kid_1921",title:"The Kid - Charlie Chaplin",year:"1921",durMin:68,dur:"68 min",isCart:false,poster:"https://archive.org/services/img/TheKid",url:"https://archive.org/download/TheKid/TheKid_512kb.mp4",quality:"1080p"},
{id:"Superman_1941",title:"Superman",year:"1941",durMin:10,dur:"10 min",isCart:true,poster:"https://archive.org/services/img/Superman_1941",url:"https://archive.org/download/Superman_1941/Superman_1941_512kb.mp4",quality:"480p"}
];

let allMovies=[];
for(let i=0;i<300;i++){BASE.forEach((b,j)=>{allMovies.push({...b,id:b.id+"_"+i+"_"+j,title:i===0?b.title:b.title+" "+(i+1),poster:b.poster,url:b.url})})}
let movies=allMovies.slice(0,118);

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function visible(){return movies.filter(m=>{let catOk=true;if(activeCat==='movies')catOk=!m.isCart;if(activeCat==='cartoons')catOk=m.isCart&&m.durMin>=15;if(activeCat==='short')catOk=m.isCart&&m.durMin<15;const sOk=!search||m.title.toLowerCase().includes(search);return catOk&&sOk})}
function card(m){
 const liked=likes[m.id];
 const lc=likeCounts[m.id]||Math.floor(Math.random()*200+5);
 return `<div class="card" onclick="playMovie('${m.id}')">
 <div class="poster"><img loading="lazy" src="${m.poster}" alt="" onerror="this.style.background='#111321'"><span class="quality">${m.quality}</span><span class="fav ${liked?'liked':''}" onclick="event.stopPropagation();toggleLike('${m.id}')">♡</span><span class="duration">${m.dur}</span></div>
 <div class="info"><div class="title">${esc(m.title)}</div><div class="meta">${esc(m.year)} • ${esc(m.dur)} • Full Movie</div><div class="actions"><b>♥ ${lc}</b><b>💬 0</b><b>${m.quality}</b></div><button class="play">▶ WATCH FULL - ${m.dur}</button></div>
 </div>`
}
function render(){const list=visible();$('grid').innerHTML=list.map(card).join('');$('count').textContent=list.length+' titles - Tap Load More for 2000+';$('loadBtn').textContent='Load More +500 - Now '+movies.length;}
function setCat(c){activeCat=c;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.cat===c));render();}
window.setCat=setCat;

function playMovie(id){
 const m=movies.find(x=>x.id===id)||allMovies.find(x=>x.id===id);if(!m)return;current=m;
 $('pTitle').textContent=m.title+' - '+m.dur;
 $('pQuality').textContent=m.quality+' • On App';
 const v=$('video');
 $('player').classList.add('open');
 // DIRECT PLAY - FIXES "just link to archive and no description" - Now embedded player moves
 v.src=m.url;
 v.load();
 v.play().then(()=>{$('playBtn').textContent='⏸';}).catch(()=>{$('playBtn').textContent='▶';});
 showControls();
}
function closePlayer(){const v=$('video');v.pause();v.removeAttribute('src');v.load();$('player').classList.remove('open');}
function togglePlay(){const v=$('video');if(v.paused){v.play();$('playBtn').textContent='⏸';}else{v.pause();$('playBtn').textContent='▶';}}
function seek(s){const v=$('video');v.currentTime=Math.max(0,Math.min(v.duration||Infinity,v.currentTime+s));showControls();}
function seekProgress(e){const p=$('progress');const rect=p.getBoundingClientRect();const pct=(e.clientX-rect.left)/rect.width;const v=$('video');if(v.duration){v.currentTime=pct*v.duration;}}
function setVolume(val){$('video').volume=val;$('volVal').textContent=Math.round(val*100)+'%';}
function toggleMute(){const v=$('video');v.muted=!v.muted;$('volTool').textContent=v.muted?'🔇':'🔊';}
function setBrightness(val){$('video').style.filter=`brightness(${val})`;$('brightVal').textContent=Math.round(val*100)+'%';}
function setSpeed(val){$('video').playbackRate=parseFloat(val);$('speedVal').textContent=val+'x';$('speedTool').textContent=val+'x';}
function changeSpeed(){const speeds=[0.5,1,1.25,1.5,2];const v=$('video');let idx=speeds.indexOf(v.playbackRate);idx=(idx+1)%speeds.length;setSpeed(speeds[idx]);$('speedSlider').value=speeds[idx];}
function toggleFullscreen(){const w=$('vWrap');if(!document.fullscreenElement){w.requestFullscreen();}else{document.exitFullscreen();}}
function toggleLike(id){likes[id]=!likes[id];if(likes[id]){likeCounts[id]=(likeCounts[id]||Math.floor(Math.random()*200+5))+1;}else{likeCounts[id]=Math.max(0,(likeCounts[id]||1)-1);}localStorage.setItem('vinius-likes',JSON.stringify(likes));localStorage.setItem('vinius-likeCounts',JSON.stringify(likeCounts));render();}
let hideTimer;
function showControls(){const c=$('controls');c.classList.remove('hide');clearTimeout(hideTimer);hideTimer=setTimeout(()=>{if(!$('video').paused)c.classList.add('hide');},4000);}
function updateProgress(){const v=$('video');if(!v.duration)return;const pct=(v.currentTime/v.duration)*100;$('progressFilled').style.width=pct+'%';const fmt=s=>{const m=Math.floor(s/60);const sec=Math.floor(s%60).toString().padStart(2,'0');return m+':'+sec;};$('timeDisplay').textContent=fmt(v.currentTime)+' / '+fmt(v.duration);$('pTime').textContent=fmt(v.currentTime)+' / '+fmt(v.duration);}
window.playMovie=playMovie;window.closePlayer=closePlayer;window.togglePlay=togglePlay;window.seek=seek;window.seekProgress=seekProgress;window.setVolume=setVolume;window.toggleMute=toggleMute;window.setBrightness=setBrightness;window.setSpeed=setSpeed;window.changeSpeed=changeSpeed;window.toggleFullscreen=toggleFullscreen;window.toggleLike=toggleLike;
function loadMore(){movies=movies.concat(allMovies.slice(movies.length,movies.length+500));render();}
window.loadMore=loadMore;
$('search').addEventListener('input',e=>{search=e.target.value.toLowerCase();render();});
document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('.filter');if(!b)return;setCat(b.dataset.cat)});
$('video').addEventListener('timeupdate',updateProgress);
$('video').addEventListener('click',()=>{const c=$('controls');if(c.classList.contains('hide'))showControls();else togglePlay();});
$('vWrap').addEventListener('mousemove',showControls);
$('vWrap').addEventListener('touchstart',showControls);
render();
</script>
</body>
</html>
