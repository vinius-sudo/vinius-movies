<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINIUS MOVIES</title><style>*{margin:0;box-sizing:border-box;font-family:Arial}body{background:#070714;color:#fff}header{background:linear-gradient(90deg,#ff0a0a,#ff4d00);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}header .logo{font-weight:900;font-size:19px}header input{background:#0006;border:1px solid #555;color:#fff;padding:6px 10px;border-radius:14px;width:120px}.cats{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:#11112a;position:sticky;top:50px;z-index:15}.cat{padding:7px 14px;border-radius:20px;background:#1d1d42;border:1px solid #333;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap}.cat.on{background:#ff1a1a;border-color:#ff1a1a;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;padding:12px}.card{background:#151538;border-radius:12px;overflow:hidden;border:1px solid #2a2a55;cursor:pointer}.card img{width:100%;height:180px;object-fit:cover;background:#000}.info{padding:7px}.tt{font-size:11px;font-weight:800;height:32px;overflow:hidden}.meta{display:flex;gap:4px;margin:4px 0}.q{background:#00ff88;color:#000;padding:2px 5px;border-radius:4px;font-size:9px;font-weight:900}.g{background:#6a5cff;color:#fff;padding:2px 5px;border-radius:4px;font-size:8px}.btn2{width:100%;background:linear-gradient(90deg,#ff0000,#ff4d00);color:#fff;border:0;padding:6px;border-radius:14px;font-weight:900;font-size:10px;cursor:pointer}#loadmore{display:block;margin:14px auto;background:#1d1d42;border:1px solid #444;color:#fff;padding:10px 22px;border-radius:22px;font-weight:900;cursor:pointer}#player{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}#player.show{display:flex}.phead{background:#141430;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.cl{background:#ff1a1a;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}video{width:100%;flex:1;background:#000;max-height:68vh}.controls{background:#10102a;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#aaa;font-size:11px}.qb{background:#222;border:1px solid #444;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:11px}.qb.on{background:#ff1a1a}.sug{background:#0e0e28;padding:10px}.srow{display:flex;gap:8px;overflow-x:auto;padding-top:6px}.scard{min-width:110px;background:#1a1a3a;border-radius:8px;overflow:hidden;border:1px solid #333;cursor:pointer}.scard img{width:100%;height:62px;object-fit:cover}.scard div{font-size:9px;padding:4px;font-weight:700;height:28px;overflow:hidden}</style></head><body>
<header><div class="logo">🎬 VINIUS MOVIES</div><div style="display:flex;gap:8px;align-items:center"><input id="search" placeholder="Search..." oninput="filterSearch()"><div style="font-size:10px;background:#00ff88;color:#000;padding:4px 8px;border-radius:10px;font-weight:900">PLAYS ON APP ✅</div></div></header>
<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>
<button id="loadmore" onclick="loadMore()">Load More From Archive ⬇️</button>
<div id="player"><div class="phead"><b id="ptitle" style="font-size:13px"></b><button class="cl" onclick="closeP()">✕</button></div><video id="vid" controls playsinline autoplay></video><div class="controls"><span id="vstatus">🔍 Finding best quality on your app...</span><button class="qb on" id="qAuto" onclick="playM(curIdx,true)">Auto HD</button><button class="qb" onclick="switchQuality('low')">360p</button><button class="qb" onclick="switchQuality('high')">1080p</button></div><div class="sug"><h4 style="font-size:12px">💡 Suggested</h4><div class="srow" id="srow"></div></div></div>
<script>
let ALL=[];let filtered=[];let page=1;let activeCat="All";let curIdx=0;let curFiles=[];let curQuality="auto";
const API="https://archive.org/advancedsearch.php?q=(collection:(feature_films OR animation_films OR sci-fi) AND mediatype:movies)&fl[]=identifier&fl[]=title&fl[]=year&sort[]=addeddate desc&rows=100&page=PAGE&output=json";
function renderCats(){let cats=["All","Horror","Sci-Fi","Animation","Action","Classic"];document.getElementById('cats').innerHTML=cats.map(c=>`<div class="cat ${activeCat===c?'on':''}" onclick="setCat('${c}')">${c==="All"?"🔥 All":c==="Horror"?"😱 Horror":c==="Sci-Fi"?"🚀 Sci-Fi":c==="Animation"?"✨ Animation":c==="Action"?"🔥 Action":"🎞️ Classic"}</div>`).join('');}
function setCat(c){activeCat=c;renderCats();applyFilter();}window.setCat=setCat;
function getCat(t){t=(t||"").toLowerCase();if(t.includes("horror")||t.includes("zombie")||t.includes("dead")||t.includes("dracula")||t.includes("haunted"))return"Horror";if(t.includes("sci")||t.includes("space")||t.includes("planet")||t.includes("alien")||t.includes("robot")||t.includes("phantom"))return"Sci-Fi";if(t.includes("animation")||t.includes("cartoon")||t.includes("popeye")||t.includes("bunny")||t.includes("superman")||t.includes("betty"))return"Animation";if(t.includes("action")||t.includes("adventure")||t.includes("western")||t.includes("charade"))return"Action";return"Classic";}
async function fetchMovies(p){let url=API.replace("PAGE",p);try{let r=await fetch(url);let j=await r.json();return j.response.docs.map(d=>({id:d.identifier,t:d.title||d.identifier,y:d.year||"19??",cat:getCat(d.title),img:`https://archive.org/services/img/${d.identifier}`}));}catch(e){return [];}}
async function loadMore(){document.getElementById('loadmore').innerText="Loading from Archive...";let more=await fetchMovies(page+1);if(more.length){page++;ALL=[...ALL,...more];applyFilter();}document.getElementById('loadmore').innerText=`Load More (${ALL.length} loaded) ⬇️`;}window.loadMore=loadMore;
async function init(){renderCats();let first=await fetchMovies(1);ALL=first;filtered=ALL;renderGrid();document.getElementById('loadmore').innerText=`Load More (${ALL.length} loaded) - Get ALL Archive ⬇️`;}
function applyFilter(){let q=document.getElementById('search').value.toLowerCase();filtered=ALL.filter(m=>{let okCat=activeCat==="All"||m.cat===activeCat;let okSearch=!q||m.t.toLowerCase().includes(q);return okCat&&okSearch;});renderGrid();}
function filterSearch(){applyFilter();}window.filterSearch=filterSearch;
function renderGrid(){document.getElementById('grid').innerHTML=filtered.map(m=>{let idx=ALL.indexOf(m);return `<div class="card" onclick="playM(${idx})"><img loading="lazy" src="${m.img}" onerror="this.src='https://via.placeholder.com/200x300/ff2222/fff?text=${m.cat}'"><div class="info"><div class="tt">${m.t}</div><div class="meta"><span class="q">${m.y} HD</span><span class="g">${m.cat}</span></div><button class="btn2">▶ WATCH ON APP</button></div></div>`}).join('');}
async function playM(i,forceReload=false){
 curIdx=i;let m=ALL[i];
 document.getElementById('ptitle').innerText=`${m.t} - ${m.y} • Plays on VINIUS App`;
 document.getElementById('player').classList.add('show');
 document.getElementById('vstatus').innerText="🔍 Finding MP4 that plays on app...";
 if(curFiles.length===0||forceReload||curIdx!==i||forceReload){
  try{
   let meta=await fetch(`https://archive.org/metadata/${m.id}`).then(r=>r.json());
   let files=(meta.files||[]).filter(f=>f.name.endsWith(".mp4")&&f.source!=="derivative").sort((a,b)=>(b.size||0)-(a.size||0));
   if(files.length===0)files=(meta.files||[]).filter(f=>f.name.endsWith(".mp4"));
   curFiles=files;
  }catch(e){curFiles=[];}
 }
 if(curFiles.length>0){
  let best=curFiles.find(f=>f.name.includes("512kb"))||curFiles.find(f=>f.name.includes("720p"))||curFiles[0];
  let url=`https://archive.org/download/${m.id}/${best.name}`;
  document.getElementById('vid').src=url;
  document.getElementById('vid').play().catch(()=>{});
  document.getElementById('vstatus').innerText=`● Playing on app: ${best.name} • No redirect to Archive • HD`;
 }else{
  document.getElementById('vstatus').innerText="⚠️ No direct MP4, using backup player";
  document.getElementById('vid').src=`https://archive.org/download/${m.id}/${m.id}_512kb.mp4`;
  document.getElementById('vid').play().catch(()=>{
   document.getElementById('vid').outerHTML=`<iframe id="vid" src="https://archive.org/embed/${m.id}" style="width:100%;flex:1;border:0" allowfullscreen></iframe>`;
  });
 }
 let s=document.getElementById('srow');s.innerHTML="";[...ALL].sort(()=>0.5-Math.random()).slice(0,12).forEach(mm=>{let idx=ALL.indexOf(mm);if(idx===i)return;s.innerHTML+=`<div class="scard" onclick="playM(${idx},true)"><img src="${mm.img}"><div>${mm.t}</div></div>`});
}
window.playM=playM;
function switchQuality(q){
 if(curFiles.length===0)return;
 let best;
 if(q==="low")best=curFiles.find(f=>f.name.includes("512kb"))||curFiles[curFiles.length-1];
 else if(q==="high")best=curFiles[0];
 else best=curFiles.find(f=>f.name.includes("720p"))||curFiles[0];
 document.getElementById('vid').src=`https://archive.org/download/${ALL[curIdx].id}/${best.name}`;
 document.getElementById('vid').play();
 document.getElementById('vstatus').innerText=`● Playing on app: ${best.name}`;
}
window.switchQuality=switchQuality;
function closeP(){document.getElementById('player').classList.remove('show');let v=document.getElementById('vid');if(v)v.pause();if(v)v.src="";curFiles=[];}window.closeP=closeP;
init();
</script></body></html>
