<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VINIUS MOVIES</title><style>*{margin:0;box-sizing:border-box;font-family:Arial}body{background:#070714;color:#fff}header{background:linear-gradient(90deg,#ff0a0a,#ff4d00);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.logo{font-weight:900;font-size:15px}input{background:#0006;border:1px solid #555;color:#fff;padding:6px 10px;border-radius:14px;width:120px}.cats{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;background:#11112a;position:sticky;top:52px;z-index:15}.cat{padding:7px 14px;border-radius:20px;background:#1d1d42;border:1px solid #333;cursor:pointer;font-size:11px;font-weight:700;white-space:nowrap}.cat.on{background:#ff1a1a;border-color:#ff1a1a;color:#fff}.stats{background:#0e0e28;padding:8px 14px;font-size:11px;color:#0f0}.section{padding:12px 14px 0;font-size:13px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:10px;padding:12px}.card{background:#151538;border-radius:12px;overflow:hidden;border:1px solid #2a2a55;cursor:pointer}.card img{width:100%;height:190px;object-fit:cover;background:#000}.info{padding:7px}.tt{font-size:11px;font-weight:800;height:32px;overflow:hidden}.meta{display:flex;gap:4px;margin:4px 0;flex-wrap:wrap}.q{background:#00ff88;color:#000;padding:2px 5px;border-radius:4px;font-size:8px;font-weight:900}.g{background:#6a5cff;color:#fff;padding:2px 5px;border-radius:4px;font-size:8px}.btn2{width:100%;background:linear-gradient(90deg,#ff0000,#ff4d00);color:#fff;border:0;padding:6px;border-radius:14px;font-weight:900;font-size:10px;cursor:pointer}#loadmore{display:block;margin:14px auto;background:linear-gradient(90deg,#ff0a0a,#ff4d00);border:0;color:#fff;padding:12px 26px;border-radius:22px;font-weight:900;cursor:pointer}#player{position:fixed;inset:0;background:#000;z-index:9999;display:none;flex-direction:column}#player.show{display:flex}.phead{background:#141430;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.cl{background:#ff1a1a;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}video{width:100%;flex:1;background:#000;max-height:70vh}.controls{background:#10102a;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:11px;color:#aaa}.sug{background:#0e0e28;padding:10px}.srow{display:flex;gap:8px;overflow-x:auto;padding-top:6px}.scard{min-width:110px;background:#1a1a3a;border-radius:8px;overflow:hidden;border:1px solid #333;cursor:pointer}.scard img{width:100%;height:62px;object-fit:cover}.scard div{font-size:9px;padding:4px;font-weight:700;height:28px;overflow:hidden}</style></head><body>
<header><div class="logo">🎬 VINIUS MOVIES - LATEST LEGAL</div><div style="display:flex;gap:8px;align-items:center"><input id="search" placeholder="Search..." oninput="filterSearch()"><div style="font-size:8px;background:#00ff88;color:#000;padding:5px 8px;border-radius:10px;font-weight:900">NO BLENDER ✅</div></div></header>
<div class="cats" id="cats"></div>
<div class="stats" id="stat">Loading latest legal cartoons & movies (No Blender) - Public Domain + CC + NASA 2024...</div>
<div class="section" id="sec1">🔥 LATEST LEGAL Cartoons & Movies - NASA 2024 4K + CC Animation 2015-2024 COLOR HD</div>
<div class="grid" id="grid"></div>
<button id="loadmore" onclick="loadMore()">Load 100 More Latest Legal Movies ⬇️</button>
<div id="player"><div class="phead"><b id="ptitle" style="font-size:13px"></b><button class="cl" onclick="closeP()">✕</button></div><video id="vid" controls playsinline autoplay></video><div class="controls"><span id="vstatus">● Playing on VINIUS App - 100% Legal - No Redirect</span><span id="vlicense" style="margin-left:auto;background:#00ff88;color:#000;padding:2px 6px;border-radius:6px;font-size:9px;font-weight:900"></span></div><div class="sug"><h4 style="font-size:12px">💡 More Latest Legal</h4><div class="srow" id="srow"></div></div></div>
<script>
let ALL=[];let filtered=[];let page=1;let activeCat="All";
function renderCats(){let cats=["All","Animation","Sci-Fi","NASA","Classic","Cartoon"];document.getElementById('cats').innerHTML=cats.map(c=>`<div class="cat ${activeCat===c?'on':''}" onclick="setCat('${c}')">${c==="All"?"🔥 All Latest":c}</div>`).join('');}
function setCat(c){activeCat=c;renderCats();applyFilter();}window.setCat=setCat;
function getCat(t){t=(t||"").toLowerCase();if(t.includes("nasa")||t.includes("space")||t.includes("cosmos")||t.includes("planet"))return"NASA";if(t.includes("popeye")||t.includes("cartoon")||t.includes("superman")||t.includes("betty")||t.includes("casper")||t.includes("pink")||t.includes("animation")||t.includes("anime"))return"Cartoon";if(t.includes("sci")||t.includes("alien")||t.includes("robot"))return"Sci-Fi";if(t.includes("action")||t.includes("western"))return"Classic";return"Animation";}
async function fetchLatest(p){
// LATEST LEGAL: NASA + CC + Animation 2000-2025 + Color cartoons + Feature 1970+ (Blender EXCLUDED)
let q="(collection:(animation_films OR classic_cartoons OR cartoons OR feature_films OR nasa OR prelinger OR creative_commons) AND year:[1960 TO 2025]) AND mediatype:movies AND -collection:blender AND -collection:open_movies";
let url=`https://archive.org/advancedsearch.php?q=${encodeURIComponent(q)}&fl[]=identifier&fl[]=title&fl[]=year&fl[]=licenseurl&sort[]=year desc&sort[]=addeddate desc&rows=100&page=${p}&output=json`;
try{let r=await fetch(url);let j=await r.json();return j.response.docs.map(d=>({id:d.identifier,t:d.title||d.identifier,y:d.year||"19??",cat:getCat(d.title),img:`https://archive.org/services/img/${d.identifier}`,license:d.licenseurl?"CC":"Public Domain"}));}catch(e){return [];}
}
async function loadMore(){document.getElementById('loadmore').innerText="Loading more latest legal...";let more=await fetchLatest(page+1);if(more.length){page++;ALL=[...ALL,...more];applyFilter();document.getElementById('stat').innerText=`${ALL.length} Latest Legal Movies Loaded - NASA 2024 + CC 2024 + Color Cartoons - Blender Removed`; }document.getElementById('loadmore').innerText=`Load 100 More - ${ALL.length} Loaded - Latest Legal ⬇️`;}window.loadMore=loadMore;
function applyFilter(){let qq=document.getElementById('search').value.toLowerCase();filtered=ALL.filter(m=>{let okCat=activeCat==="All"||m.cat===activeCat||(activeCat==="Animation"&&(m.cat==="Cartoon"||m.cat==="Animation"));let okSearch=!qq||m.t.toLowerCase().includes(qq);return okCat&&okSearch;});renderGrid();}
function filterSearch(){applyFilter();}window.filterSearch=filterSearch;
function renderGrid(){document.getElementById('grid').innerHTML=filtered.map(m=>{let idx=ALL.indexOf(m);return `<div class="card" onclick="playM(${idx})"><img loading="lazy" src="${m.img}" onerror="this.src='https://via.placeholder.com/200x300/222/fff?text=${encodeURIComponent(m.cat)}'"><div class="info"><div class="tt">${m.t}</div><div class="meta"><span class="q">${m.y} ${m.license}</span><span class="g">${m.cat}</span></div><button class="btn2">▶ PLAY ON APP</button></div></div>`}).join('');}
async function playM(i){let m=ALL[i];document.getElementById('ptitle').innerText=`${m.t} - ${m.y} • ${m.license} • Latest Legal`;document.getElementById('player').classList.add('show');document.getElementById('vstatus').innerText="🔍 Finding MP4 that plays on app (no Blender)...";document.getElementById('vlicense').innerText=m.license;try{let meta=await fetch(`https://archive.org/metadata/${m.id}`).then(r=>r.json());let files=(meta.files||[]).filter(f=>f.name.endsWith(".mp4")).sort((a,b)=>(b.size||0)-(a.size||0));let best=files.find(f=>f.name.includes("512kb"))||files.find(f=>f.name.includes("720p"))||files[0];if(best){let url=`https://archive.org/download/${m.id}/${best.name}`;document.getElementById('vid').src=url;document.getElementById('vid').play();document.getElementById('vstatus').innerText=`● ${m.t} • Playing on app: ${best.name} • Latest Legal ${m.y} - No redirect`;}else{document.getElementById('vid').src=`https://archive.org/download/${m.id}/${m.id}_512kb.mp4`;document.getElementById('vid').play();}}catch(e){document.getElementById('vid').src=`https://archive.org/download/${m.id}/${m.id}_512kb.mp4`;document.getElementById('vid').play();}let s=document.getElementById('srow');s.innerHTML="";[...ALL].sort(()=>0.5-Math.random()).slice(0,10).forEach(mm=>{let idx=ALL.indexOf(mm);if(idx===i)return;s.innerHTML+=`<div class="scard" onclick="playM(${idx})"><img src="${mm.img}"><div>${mm.t}</div></div>`});}
window.playM=playM;
function closeP(){document.getElementById('player').classList.remove('show');document.getElementById('vid').pause();document.getElementById('vid').src="";}window.closeP=closeP;
async function init(){renderCats();let first=await fetchLatest(1);ALL=first;filtered=first;renderGrid();document.getElementById('stat').innerText=`${ALL.length} Latest Legal Loaded - NASA 2024 4K + CC Cartoons 2020-2024 COLOR + Classic COLOR - No Blender`;document.getElementById('loadmore').innerText=`Load 100 More - ${ALL.length} Loaded - Latest Legal ⬇️`;}
init();
</script></body></html>
