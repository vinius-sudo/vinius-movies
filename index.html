<html lang="en">

<meta charset="utf-8">

<title>VINIUS MOVIES - FINAL FIX</title>
<style>
:root{--bg:#080b12;--text:#f5f7fb;--muted:#a3afc2;--green:#22e6a2;--line:#273449}
*{box-sizing:border-box}body{margin:0;background:#080b12;color:var(--text);font-family:Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:10;display:flex;gap:14px;align-items:center;padding:14px 5%;background:#080b12ed;border-bottom:1px solid #ffffff15}
.brand{font-weight:950;font-size:20px}.brand span{color:var(--green)}
.search{margin-left:auto;width:min(420px,100%);padding:11px 16px;border:1px solid var(--line);border-radius:30px;background:#121a29;color:white;outline:none}
main{width:min(1240px,92%);margin:auto;padding:20px 0 60px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:16px 0;flex-wrap:wrap;gap:10px}.count{font-size:13px;color:var(--muted)}
.load{background:var(--green);color:#032017;border:0;padding:10px 16px;border-radius:24px;font-size:12px;font-weight:900;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:#151d2e;border:1px solid #ffffff12;border-radius:14px;overflow:hidden;cursor:pointer}.card:hover{border-color:#22e6a277;transform:translateY(-2px)}
.poster{height:230px;background:#0f1428;position:relative;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.tag{position:absolute;top:8px;left:8px;background:var(--green);color:#042117;padding:4px 7px;border-radius:5px;font-size:9px;font-weight:900;z-index:2}
.dur{position:absolute;bottom:8px;right:8px;background:#000c;color:white;padding:4px 7px;border-radius:6px;font-size:10px;z-index:2}
.info{padding:10px}.title{font-size:13px;font-weight:800;line-height:1.3;min-height:34px}.meta{font-size:10px;color:var(--muted);margin:6px 0 8px}
.watch{width:100%;border:0;border-radius:8px;background:#22e6a2;color:#042117;padding:9px;font-size:11px;font-weight:900;cursor:pointer}
#player{display:none;position:fixed;inset:0;z-index:50;background:#000;flex-direction:column}
#player.open{display:flex}
.phead{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0c111b}
.close{width:32px;height:32px;border:0;border-radius:50%;background:#ffffff18;color:white;font-size:18px;cursor:pointer}
.vwrap{flex:1;background:#000;display:flex;align-items:center;justify-content:center}
.vwrap video{width:100%;height:100%;object-fit:contain;background:#000}
.pfoot{padding:10px 16px;background:#0c111b;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:620px){header{flex-wrap:wrap}.search{order:2;max-width:none}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.poster{height:200px}}
</style>
</head>
<body>

    {id:"Superman_1941_2",title:"Superman Cartoon",year:"1941",dur:"10 min"},
    {id:"Betty_Boop_1933",title:"Betty Boop Cartoon",year:"1933",dur:"7 min"}

  let shown=50;
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  // FIX: Use __ia_thumb.jpg - This 404s if no real thumb, so onerror can REMOVE the pillar card
  function posterUrl(id){return 'https://archive.org/download/'+encodeURIComponent(id.split('_')[0])+'/__ia_thumb.jpg'}

  function render(){
    const q=$('search').value.trim().toLowerCase();
    const filtered=ALL.slice(0,shown).filter(m=>!q||m.title.toLowerCase().includes(q));
    $('count').textContent=`${filtered.length} shown • ${shown} / ${ALL.length} UNIQUE - Pillars auto-removed if no picture`;
    $('grid').innerHTML=filtered.map(m=>`
      <div class="card" id="card-${m.id}" onclick="playMovie('${m.id}')">
        <div class="poster">
          <img loading="lazy" src="${posterUrl(m.id)}" alt="" 
               onerror="this.closest('.card').style.display='none';">
          <span class="tag">HD</span><span class="dur">${esc(m.dur)}</span>
        </div>
        <div class="info"><div class="title">${esc(m.title)}</div><div class="meta">${esc(m.year)} • ${esc(m.dur)}</div><button class="watch">▶ WATCH NOW</button></div>
      </div>
    `).join('');
  }

  async function playMovie(id){
    const m=ALL.find(x=>x.id===id); if(!m)return;
    $('playerTitle').textContent=m.title;
    const video=$('video');
    $('player').classList.add('open');
    $('playerStatus').textContent='Checking Archive database for playable file for '+id+'...';
    video.pause();video.removeAttribute('src');video.load();
    try{
      const r=await fetch('https://archive.org/metadata/'+encodeURIComponent(id.split('_')[0]));
      if(!r.ok)throw new Error('Metadata HTTP '+r.status);
      const meta=await r.json();
      const files=(meta.files||[]).filter(f=>{
        const n=String(f.name||'').toLowerCase();
        if(!/\.(mp4|m4v|webm)$/.test(n))return false;
        if(/thumb|jpg|jpeg|png|gif|__ia_|srt|txt|xml|json/.test(n))return false;
        const sz=Number(f.size||0);
        if(sz>0&&sz<500000)return false;
        return true;
      });
      files.sort((a,b)=>{
        const an=String(a.name).toLowerCase(), bn=String(b.name).toLowerCase();
        let as=0,bs=0;
        if(an.includes('512kb'))as+=100; if(bn.includes('512kb'))bs+=100;
        if(an.endsWith('.mp4'))as+=50; if(bn.endsWith('.mp4'))bs+=50;
        return bs-as;
      });
      const chosen=files[0];
      if(!chosen)throw new Error('No MP4 found');
      const safePath=String(chosen.name).split('/').map(p=>encodeURIComponent(p)).join('/');
      const url=`https://archive.org/download/${encodeURIComponent(id.split('_')[0])}/${safePath}`;
      $('playerStatus').textContent='Found: '+chosen.name+' - Playing directly - No archive redirect';
      video.src=url;
      video.load();
      await video.play();
      $('playerStatus').textContent='Playing: '+m.title+' - Comfortable viewing';
    }catch(e){
      $('playerStatus').textContent='Error: '+e.message;
      const fallback=`https://archive.org/download/${encodeURIComponent(id.split('_')[0])}/${encodeURIComponent(id.split('_')[0])}_512kb.mp4`;
      video.src=fallback;
      video.load();
      video.play().catch(()=>{$('playerStatus').textContent='Failed to play '+id+'. Try another.';});
    }
  }

  window.playMovie=playMovie;
  function closePlayer(){const v=$('video');v.pause();v.removeAttribute('src');v.load();$('player').classList.remove('open');}
  $('closePlayer').addEventListener('click',closePlayer);
  $('player').addEventListener('click',e=>{if(e.target===$('player'))closePlayer();});
  $('search').addEventListener('input',render);
  $('loadMore').addEventListener('click',()=>{shown=ALL.length;render();$('loadMore').textContent='All 120 UNIQUE loaded';$('loadMore').disabled=true;});
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayer();});
  render();
})();
