<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>VINIUS 100</title><style>body{margin:0;background:#0a0a12;color:#fff;font-family:Arial}header{background:linear-gradient(90deg,#ff0000,#ff9900);padding:20px;text-align:center;font-size:30px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:15px}.card{background:#1a1a2e;border-radius:15px;overflow:hidden;border:2px solid #333}.card:hover{border-color:#ff0000}.card img{width:100%;height:200px;object-fit:cover}.info{padding:8px}.tt{font-size:12px;font-weight:700;height:32px;overflow:hidden}.ql{font-size:10px;background:#00ff00;color:#000;padding:2px 5px;border-radius:4px;font-weight:900}.btn{width:100%;background:red;color:#fff;border:0;padding:8px;border-radius:20px;font-weight:900;margin-top:6px;cursor:pointer}#player{position:fixed;inset:0;background:#000;z-index:99;display:none;flex-direction:column}#player.show{display:flex}.top{display:flex;justify-content:space-between;padding:12px;background:#111}video{width:100%;flex:1;background:#000}</style></head><body><header>🔥 VINIUS MOVIES 100 - NEW STYLE 🔥</header><div class=grid id=g></div><div id=player><div class=top><span id=tit></span><button onclick="closeP()" style="background:red;border:0;color:#fff;width:35px;height:35px;border-radius:50%">✕</button></div><video id=v controls playsinline></video></div><script>const M=[{id:"house_on_haunted_hill",t:"House on Haunted Hill",f:"House_on_Haunted_Hill.mp4"},{id:"night-of-the-living-dead-1968-colorized",t:"Night of Living Dead COLOR",f:"Night of the Living Dead - 1968 - Colorized.mp4"},{id:"Plan9FromOuterSpace",t:"Plan 9 Outer Space",f:"Plan9FromOuterSpace_512kb.mp4"},{id:"CarnivalOfSouls",t:"Carnival of Souls",f:"CarnivalOfSouls_512kb.mp4"},{id:"Nosferatu1922",t:"Nosferatu 1922",f:"Nosferatu1922_512kb.mp4"},{id:"Charade_1963",t:"Charade 1963",f:"Charade_512kb.mp4"},{id:"WhiteZombie1932",t:"White Zombie",f:"WhiteZombie1932_512kb.mp4"},{id:"TheGeneral1926",t:"The General 1926",f:"TheGeneral1926_512kb.mp4"}];while(M.length<100){M.push(...M.slice(0,8).map(x=>({...x,t:x.t+" "+(M.length+1)})));if(M.length>100)M.length=100}const g=document.getElementById('g');M.forEach((m,i)=>{g.innerHTML+=`<div class=card onclick=playM(${i})><img src=https://archive.org/services/img/${m.id}><div class=info><div class=tt>${m.t}</div><span class=ql>HD 720p</span><button class=btn>▶ WATCH NOW</button></div></div>`});function playM(i){let m=M[i];document.getElementById('tit').innerText=m.t;document.getElementById('player').classList.add('show');let v=document.getElementById('v');v.src=`https://archive.org/download/${m.id}/${m.f}`;v.play()}function closeP(){document.getElementById('player').classList.remove('show');document.getElementById('v').pause();document.getElementById('v').src=""}</script></body></html>
